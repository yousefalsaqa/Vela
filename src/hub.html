<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vela</title>
<!--
  Her mark, inline. Installed to the taskbar she needs an icon, and a file
  would mean a request that carries no key and comes back 401 — an error in
  his console every single load, for a picture. Two rings and an off-centre
  point: the same shape the field draws, small enough to read at 16px.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305090d'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%234fd1db' stroke-opacity='.32' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%234fd1db' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='16' r='1.7' fill='%23f5b95f'/%3E%3C/svg%3E">
<meta name="theme-color" content="#05090d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  The room.

  Not a page with sections: a space she is in. The whole viewport is her field,
  and the parts appear in it when they have something to carry. Nothing here is
  reserved for chat, because conversation is one of the things that happens in
  a room rather than the reason the room exists.

  Two voices only. Serif is Vela; mono is the instrument she lives inside —
  his typing, tool names, state, times. That contrast is the whole typographic
  idea and there is no third face.

  Colour is meaning, not decoration. Cyan is her working. Gold is her speaking.
  Pale is him. They are scarce on purpose: three accents on a near-black field
  say something, and the same three everywhere say nothing.
*/
:root {
  --void: #05090d;
  --ink: #e9f2f6;
  --dim: #7a929e;
  --faint: #3f525d;
  --hair: rgba(140, 190, 215, .10);
  --cyan: #4fd1db;
  --gold: #f5b95f;
  --wrong: #ff8172;

  --serif: "Instrument Serif", ui-serif, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --pad: clamp(1.1rem, 2.6vw, 2.4rem);
  --rail: 2.6rem;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .7, .3, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  min-height: 100dvh;
  background: var(--void);
  color: var(--ink);
  font: 400 15px/1.55 var(--mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Her presence is the ground everything else stands on, not a widget in a
   corner. It is painted from real amplitude and real activity; see draw(). */

.room {
  position: relative;
  z-index: 1;
  height: 100dvh;
  display: grid;
  grid-template-rows: var(--rail) minmax(0, 1fr) auto;
  grid-template-columns: 100%;
}

/* ── the rail ─────────────────────────────────────────────────────────────
   What she is doing, in as few words as it takes. Nothing lives here just
   because the value exists: no turn counts, no pid, no uptime. */
.rail {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: 0 var(--pad);
  min-width: 0;
}
.mark {
  margin: 0;
  font: 400 1.15rem/1 var(--serif);
  letter-spacing: .01em;
  flex: 0 0 auto;
}
.mark em { font-style: italic; color: var(--cyan); transition: color .7s var(--ease); }
body[data-state="speaking"] .mark em { color: var(--gold); }
body[data-state="lost"] .mark em { color: var(--faint); }

.state {
  font: 500 .62rem/1 var(--mono);
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--dim);
  flex: 0 0 auto;
}
body[data-state="working"] .state { color: var(--cyan); }
body[data-state="speaking"] .state { color: var(--gold); }
body[data-state="lost"] .state { color: var(--wrong); }

/* The tool she is in the middle of. One line, present tense, gone after. */
.doing {
  min-width: 0;
  flex: 1 1 auto;
  font: 400 .66rem/1 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity .35s var(--ease);
}
.doing.on { opacity: 1; }

.railkeys { margin-left: auto; display: flex; align-items: center; gap: .55rem; flex: 0 0 auto; }
.probe {
  font: 400 .6rem/1 var(--mono);
  color: var(--faint);
  letter-spacing: .04em;
}
.probe[hidden] { display: none; }

/* ── the floor ────────────────────────────────────────────────────────────
   Words on the left, her field on the right. When she puts something up, the
   material takes the right and she steps in behind the words. */
.floor {
  position: relative;
  padding: 0 var(--pad);
  min-height: 0;
  /* One row, so the thread is bounded by the desk rather than merely clipped
     by it. Without this the thread is a block of content height: it grows past
     the floor, overflow:hidden below cuts it off, and because it never
     overflows *itself* its own overflow-y:auto has nothing to scroll. The
     panels are absolute and sit outside this. */
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  /* The desk's own edges. A panel's rectangle is worked out against the floor
     at load; when the composer grows for a multi-line message the floor
     shrinks under it, and without this a low panel would keep its old size
     and paint its near-opaque body down over the dock — hiding the text he is
     typing and swallowing clicks meant for send. Clipping here takes both the
     paint and the hit-testing with it. */
  overflow: hidden;
}
/* The conversation is the base layer, not a window to be managed. It keeps
   the left of the desk and the panels float over the rest of it. */
.thread { max-width: 52ch; }
body[data-stage="on"] .thread { max-width: 40ch; }

/* ── what was said ────────────────────────────────────────────────────────
   Bottom-aligned, so the newest thing sits where the eye already is and the
   rest drifts up out of the way. Faded at the top rather than cut, because a
   hard edge reads as a panel and this is meant to read as memory. */
.thread {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 1.6rem;
  padding: 2rem 0 1.2rem;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 100%);
}
.thread::-webkit-scrollbar { width: 0; }
/* Holds the newest thing at the bottom where the eye already is, and gives up
   its space the moment there is more to say than room to say it. Bottom
   alignment by justify-content makes the overflow unreachable instead. */
.fill { flex: 1 1 0; min-height: 0; }

.turn { flex: 0 0 auto; }
/* Exactly one exchange is ever at full weight. */
.turn.past { opacity: .34; }
.turn.past .her { font-size: .95rem; line-height: 1.5; }
.turn.past .steps, .turn.past .took { display: none; }

.you {
  margin: 0 0 .55rem;
  font: 400 .72rem/1.5 var(--mono);
  letter-spacing: .02em;
  color: var(--dim);
  overflow-wrap: anywhere;
}
.you::before { content: "› "; color: var(--faint); }
/* His hands on her screen, which is not the same act as typing. */
.you.onscreen::before { content: "screen › "; color: var(--gold); opacity: .75; }

.her {
  margin: 0;
  font: 400 clamp(1.25rem, 1.9vw, 1.7rem)/1.38 var(--serif);
  letter-spacing: -.004em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  transition: font-size .45s var(--ease), opacity .45s var(--ease);
}
.caret {
  display: inline-block;
  width: 1px;
  height: .82em;
  vertical-align: -.04em;
  margin-left: .08em;
  background: var(--cyan);
}

/* Each word arrives on its own and lights as it is actually spoken. The head
   is not decoration: it is where the audio has really got to. */
.w { display: inline-block; transition: color .16s var(--ease); }
.turn.past .w { transition: none; color: inherit; }
.w.saying { color: var(--gold); }
.w.said { color: var(--ink); }

/* She started this one. No line of his above it, so it gets its own edge. */
.turn.unbidden { border-left: 1px solid var(--gold); padding-left: .9rem; margin-left: -.9rem; }
.turn.unbidden .when {
  display: block;
  margin-bottom: .4rem;
  font: 500 .58rem/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
}

/* The work, folded away. Countable, reachable, and not in the way. */
.steps {
  display: block;
  margin-top: .7rem;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  font: 400 .62rem/1 var(--mono);
  letter-spacing: .06em;
  color: var(--faint);
  text-align: left;
}
.steps:hover { color: var(--dim); }
.steps[hidden] { display: none; }
.stepped {
  margin: .6rem 0 0;
  padding: 0 0 0 .9rem;
  border-left: 1px solid var(--hair);
  list-style: none;
  font: 400 .62rem/1.7 var(--mono);
  color: var(--faint);
  overflow-wrap: anywhere;
}
.stepped[hidden] { display: none; }
.took { margin-top: .5rem; font: 400 .6rem/1 var(--mono); color: var(--faint); letter-spacing: .06em; }

.hitch {
  margin: 0;
  padding-left: .8rem;
  border-left: 1px solid var(--wrong);
  color: var(--wrong);
  font: 400 .7rem/1.5 var(--mono);
  overflow-wrap: anywhere;
}

/* Nothing said yet is nothing shown. Quiet is a legitimate state and it does
   not need a sentence explaining itself. */
/* A tab she does not know. It sits where her words would, at their size and
   in their place, because it is the one thing on screen and it should read
   like her saying it rather than an error stranded in a corner. */
.locked {
  align-self: center;
  max-width: 34ch;
  margin: auto 0;
  font: 400 .74rem/1.7 var(--mono);
  color: var(--dim);
}
.locked b { display: block; margin-bottom: .6rem; font: 400 clamp(1.25rem, 1.9vw, 1.7rem)/1.38 var(--serif); color: var(--ink); }
.locked code { color: var(--cyan); font-size: .95em; }
.locked[hidden] { display: none; }

/* ── panels ───────────────────────────────────────────────────────────────
   Two things float on the desk: what she is showing, and what she is doing.
   He puts them where he wants them and they stay there.

   Not windows in the operating-system sense — no title bar, no buttons, no
   shadow. A hairline, a name, and a corner. The name is the handle, because
   a panel that needs a separate strip to drag by is a panel wearing chrome.
*/
.panel {
  position: absolute;
  z-index: 2;
  display: none;
  grid-template-rows: auto minmax(0, 1fr);
  min-width: 14rem;
  min-height: 6rem;
  background: rgba(6, 11, 16, .93);
  border: 1px solid var(--hair);
  backdrop-filter: blur(3px);
}
.panel.up { z-index: 3; }
.panel > header {
  display: flex;
  align-items: baseline;
  gap: .7rem;
  padding: .5rem .7rem;
  border-bottom: 1px solid var(--hair);
  cursor: grab;
  user-select: none;
  min-width: 0;
}
.panel > header:active { cursor: grabbing; }
.panel h2 {
  margin: 0;
  font: 400 .95rem/1.3 var(--serif);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.panel .note {
  margin: 0;
  min-width: 0;
  font: 400 .62rem/1.4 var(--mono);
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Keep the Work panel between turns instead of letting it leave with each
   one. Off it reads as a faint verb; pinned it goes gold, the same language
   the rest of the room uses for "she is holding this". */
.keep {
  margin-left: auto;
  flex: 0 0 auto;
  border: 0;
  background: none;
  padding: 0 .1rem;
  cursor: pointer;
  color: var(--faint);
  font: 500 .58rem/1 var(--mono);
  letter-spacing: .2em;
  text-transform: uppercase;
}
.keep:hover { color: var(--dim); }
.keep[aria-pressed="true"] { color: var(--gold); }
.panel .shut {
  margin-left: auto;
  flex: 0 0 auto;
  border: 0;
  background: none;
  padding: 0 .2rem;
  cursor: pointer;
  color: var(--faint);
  font: 400 .95rem/1 var(--mono);
}
.panel .shut:hover { color: var(--ink); }
/* The corner. Two hairlines, which is enough to say "pull me". */
.grip {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 14px;
  height: 14px;
  cursor: nwse-resize;
  background:
    linear-gradient(to top left, transparent 45%, var(--hair) 45%, var(--hair) 55%, transparent 55%),
    linear-gradient(to top left, transparent 65%, var(--hair) 65%, var(--hair) 72%, transparent 72%);
}
/* While a panel is being dragged the iframe below would swallow the pointer,
   and the drag would stop dead the moment it crossed her screen. */
.shield {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: none;
  cursor: grabbing;
}
body.dragging .shield { display: block; }

/* ── the work, while it is happening ──────────────────────────────────────
   One dim line in the rail is right for a turn that reads a file and answers.
   It is useless for watching her build something, which is the case where he
   actually wants to see the machine work: which file, which command, how far
   in. Nothing here is invented — one line per real tool. */
/* Present only while there is work to show. "Working" is not enough: most
   turns are her thinking and answering, and an empty panel arriving for two
   seconds of that is furniture being moved for nothing. The first real tool
   call is what summons it. */
.panel.works.on { display: grid; }
.works ul {
  margin: 0;
  padding: .5rem .7rem;
  list-style: none;
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  gap: .28rem;
  font: 400 .66rem/1.5 var(--mono);
  color: var(--faint);
}
.works ul::-webkit-scrollbar { width: 0; }
.works li {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: .4;
  transition: opacity .5s var(--ease), color .5s var(--ease);
}
/* The one she is on. Older steps are still there, just no longer the point. */
.works li:last-child { opacity: 1; color: var(--dim); }
/* Reading is noise; changing something is the thing he is watching for. */
.works li.made { color: var(--cyan); opacity: .85; }
.works li.made:last-child { opacity: 1; }
.works li::before { content: attr(data-verb) " "; color: var(--faint); }

/* ── the stage ────────────────────────────────────────────────────────────
   What she pulled onto the bench between us. */
body[data-stage="on"] .panel.stage { display: grid; }
.stage iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }

/* ── the dock ─────────────────────────────────────────────────────────────
   Dormant until he means to type. A hairline and a caret is enough to say
   "there is a way in" without holding a third of the screen for it. */
.dock {
  display: flex;
  align-items: center;
  gap: .7rem;
  margin: 0 var(--pad);
  padding: .6rem 0 calc(.7rem + var(--safe-b));
  border-top: 1px solid var(--hair);
  transition: border-color .4s var(--ease);
}
body[data-typing="on"] .dock { border-top-color: rgba(79, 209, 219, .38); }
/* Two pixels of truth: is the microphone hearing him, is she making sound.
   Sits on the dock's own rule, so it costs no space at all. */
.level {
  position: absolute;
  left: 0;
  right: 0;
  top: -1px;
  height: 2px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  opacity: .5;
  pointer-events: none;
}
body[data-state="speaking"] .level { background: var(--gold); }
.dock { position: relative; }
.dock::before {
  content: "›";
  color: var(--faint);
  font: 400 .8rem/1 var(--mono);
  flex: 0 0 auto;
  transition: color .3s var(--ease);
}
body[data-typing="on"] .dock::before { color: var(--cyan); }

.dock textarea {
  flex: 1 1 auto;
  min-width: 0;
  height: 1.5rem;
  max-height: 24vh;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: 400 .84rem/1.5 var(--mono);
  resize: none;
  overflow-y: auto;
  scrollbar-width: none;
}
.dock textarea::-webkit-scrollbar { width: 0; }
.dock textarea:focus { outline: none; }
.dock textarea::placeholder { color: var(--faint); }

.key {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1.9rem;
  height: 1.9rem;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  color: var(--faint);
  transition: color .2s var(--ease);
}
.key:hover { color: var(--ink); }
.key:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
.key[hidden] { display: none; }
.key svg { width: 1rem; height: 1rem; fill: currentColor; }
.key[aria-pressed="true"] { color: var(--gold); }
.key.hot { color: var(--ink); }
/* Only ever on screen while there is something to stop, so it reads as a state
   of hers rather than a control that happens to be available. Gold because
   that is already what her speaking looks like here. */
.key.stop { color: var(--gold); }
.key.stop:hover { color: var(--ink); }
.send {
  width: auto;
  padding: 0 .1rem;
  font: 500 .62rem/1 var(--mono);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--cyan);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease);
}
body[data-typing="on"] .send { opacity: 1; pointer-events: auto; }

/* The handle that pulls memory up. Only earns its place on a phone, where the
   thread is not on screen to begin with. */
.pull {
  display: none;
  position: absolute;
  top: -1.5rem;
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  background: none;
  padding: .35rem 1.4rem;
  cursor: pointer;
  color: var(--faint);
  font: 500 .56rem/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
}

/* ── narrow ───────────────────────────────────────────────────────────────
   Not the desk folded up. A different body for the same intelligence: her
   state, the one thing that matters now, and a way to answer. Memory is
   pulled up when he wants it rather than filling the screen by default. */
@media (max-width: 860px) {
  :root { --rail: 2.4rem; }
  .floor { grid-template-columns: 100%; padding: 0 var(--pad); }
  body[data-stage="on"] .floor { grid-template-columns: 100%; }

  /* Her field is the centre; words sit low in it and stay short. */
  .thread {
    padding: 1rem 0 .6rem;
    gap: 1.1rem;
    max-height: 100%;
  }
  .her { font-size: clamp(1.15rem, 5vw, 1.5rem); }
  .turn.past { display: none; }

  /* Pulled up, memory covers the room rather than sharing it. */
  body[data-memory="on"] .thread {
    position: fixed;
    inset: var(--rail) 0 0;
    z-index: 4;
    padding: 1.2rem var(--pad) 5rem;
    background: rgba(5, 9, 13, .97);
    gap: 1.4rem;
  }
  body[data-memory="on"] .fill { display: none; }
  body[data-memory="on"] .turn.past { display: block; }

  /* No desk to arrange on a phone. Panels fill the space they are given and
     stay where they are put by the layout, not by his thumb. */
  .panel {
    position: static;
    width: auto !important;
    height: auto !important;
    border: 0;
    background: none;
    backdrop-filter: none;
  }
  .panel.stage { height: 100% !important; }
  .panel > header { padding-left: 0; padding-right: 0; cursor: default; }
  .grip { display: none; }
  .panel.works.on { max-height: 34dvh; }

  /* Shown on a phone, the material is the interface — but not a silent one.
     Her latest line lies along the bottom of it, over a fade so the diagram
     still reads underneath, and taps pass straight through to the thing she
     is showing. Everything older is behind the handle where it was. */
  body[data-stage="on"] .thread {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 32dvh;
    padding: 2.5rem 0 .5rem;
    pointer-events: none;
    background: linear-gradient(to top, var(--void) 42%, rgba(5, 9, 13, .82) 72%, transparent);
    -webkit-mask-image: none;
    mask-image: none;
  }
  body[data-stage="on"] .turn.past,
  body[data-stage="on"] .steps,
  body[data-stage="on"] .took { display: none; }
  body[data-stage="on"] .her { font-size: 1.05rem; line-height: 1.35; }

  /* Pulling memory up wins over both. Declared last and with both attributes
     so it beats the stage rules above it on their own terms. */
  body[data-memory="on"][data-stage="on"] .thread,
  body[data-memory="on"] .thread {
    position: fixed;
    inset: var(--rail) 0 0;
    max-height: none;
    padding: 1.2rem var(--pad) 5rem;
    background: rgba(5, 9, 13, .97);
    pointer-events: auto;
  }
  body[data-memory="on"][data-stage="on"] .turn.past,
  body[data-memory="on"] .turn.past { display: block; }
  body[data-memory="on"][data-stage="on"] .steps,
  body[data-memory="on"][data-stage="on"] .took { display: block; }
  .stage { padding-bottom: .4rem; }
  .stage header { padding-top: .5rem; }
  .stage h2 { font-size: 1rem; }
  .stage .note { display: none; }

  /* Above the memory sheet, always. It covers the room when it is up, and a
     way in that is underneath it is a way in he cannot reach — including the
     handle that closes the sheet again. */
  .dock {
    position: relative;
    z-index: 5;
    background: var(--void);
    gap: .55rem;
    padding-bottom: calc(.6rem + var(--safe-b));
  }
  .pull { display: block; }
  body[data-memory="on"] .pull { color: var(--dim); }
  /* A finger needs more than a cursor does, without becoming a toolbar. */
  .key { width: 2.4rem; height: 2.4rem; }
  .key svg { width: 1.15rem; height: 1.15rem; }
  .dock textarea { font-size: 16px; } /* iOS zooms anything smaller on focus */
}

/* Landscape on a phone: almost no height, so the rail and the words give way
   and whatever she is showing keeps nearly all of it. */
@media (max-height: 460px) and (orientation: landscape) {
  :root { --rail: 2rem; }
  .thread { padding: .5rem 0; gap: .7rem; }
  .her { font-size: 1.05rem; }
  .stage header { padding-top: .35rem; padding-bottom: .4rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body data-state="idle">

<script src="/anime.js"></script>
<script>
"use strict";

/* Her key.

   EventSource cannot carry a header, so it arrives in the address bar, and is
   taken out of the bar immediately so it stops living in the history. That
   alone used to make the page single-use: reloading a tab sent a bare URL and
   she turned it away. The key is kept here instead, so a tab he pinned once
   still opens months later. It stays in this page's own storage, which the
   sandboxed screen frame has no way to read. */
const STORE = "vela.key";
const fromBar = new URLSearchParams(location.search).get("k") || "";

let stored = "";
try { stored = localStorage.getItem(STORE) || ""; } catch { stored = ""; }
if (fromBar) {
  try { localStorage.setItem(STORE, fromBar); } catch { /* private window; this tab still works */ }
  history.replaceState(null, "", location.pathname);
}
const KEY = fromBar || stored;
const auth = { authorization: "Bearer " + KEY };
const json = Object.assign({ "content-type": "application/json" }, auth);

const $ = (id) => document.getElementById(id);
const thread = $("thread"), stateEl = $("state"), doingEl = $("doing"), lockedEl = $("locked");
const dock = $("dock"), text = $("text"), micKey = $("mic"), earKey = $("ear"), sendKey = $("send");
const stopKey = $("stop");
const stage = $("stage"), stageTitle = $("stageTitle"), stageNote = $("stageNote");
const stageFrame = $("stageFrame"), stageShut = $("stageShut"), probe = $("probe");
const works = $("works"), worksPanel = $("worksPanel"), worksCount = $("worksCount"), worksKeep = $("worksKeep");
const level = $("level"), shield = $("shield");
const pull = $("pull");

const A = window.anime || null;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const animate = (t, o) => (A && !still ? A.animate(t, o) : null);
const phone = () => matchMedia("(max-width: 860px)").matches;

/* What is on the stage, and whether he has put it away. */
let screenUp = null, stageHidden = false;

/* ════════════════════════════════════════════════════════════════════════
   The desk

   Two panels float on it, and where he puts them is where they stay. Not a
   window manager: no title bars, no minimise, no z-order to think about. A
   panel is a hairline round something, its name is the handle, and the
   corner pulls. What it costs is one remembered rectangle each.

   Positions are kept per panel and per rough window size, because a layout
   arranged on the wide monitor is wrong on the laptop and being handed the
   wrong one is worse than being handed none.
   ════════════════════════════════════════════════════════════════════════ */
const DESK = "vela.desk";
const bucket = () => (innerWidth < 1200 ? "small" : innerWidth < 2000 ? "medium" : "large");

function deskRead() {
  try { return JSON.parse(localStorage.getItem(DESK) || "{}"); } catch { return {}; }
}
function deskWrite(all) {
  try { localStorage.setItem(DESK, JSON.stringify(all)); } catch { /* private window */ }
}

/** Where a panel goes when he has never moved it. Fractions of the desk. */
const DEFAULTS = {
  stage: { x: .38, y: .02, w: .60, h: .60 },
  works: { x: .38, y: .65, w: .60, h: .33 },
};

function place(panel) {
  const name = panel.dataset.panel;
  const desk = panel.parentElement.getBoundingClientRect();
  const saved = (deskRead()[bucket()] || {})[name] || DEFAULTS[name];
  // Kept as fractions so a resized window rearranges rather than strands a
  // panel off the edge.
  panel.style.left = Math.round(saved.x * desk.width) + "px";
  panel.style.top = Math.round(saved.y * desk.height) + "px";
  panel.style.width = Math.round(saved.w * desk.width) + "px";
  panel.style.height = Math.round(saved.h * desk.height) + "px";
}

function remember(panel) {
  const desk = panel.parentElement.getBoundingClientRect();
  const all = deskRead();
  const mine = (all[bucket()] = all[bucket()] || {});
  mine[panel.dataset.panel] = {
    x: parseFloat(panel.style.left) / desk.width,
    y: parseFloat(panel.style.top) / desk.height,
    w: parseFloat(panel.style.width) / desk.width,
    h: parseFloat(panel.style.height) / desk.height,
  };
  deskWrite(all);
}

/**
 * Drag by the name, resize by the corner.
 *
 * Pointer capture rather than mouse events, so a fast drag that leaves the
 * panel keeps going; and a shield over everything while it runs, because her
 * screen is an iframe and an iframe swallows the pointer the moment it
 * crosses — the drag would stop dead halfway.
 */
function movable(panel) {
  const head = panel.querySelector("header");
  const grip = panel.querySelector(".grip");
  if (!head || !grip) return;

  const start = (e, mode) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    if (e.target.closest("button")) return;      // the × is not a handle
    if (phone()) return;                          // stacked; nothing to arrange
    const desk = panel.parentElement.getBoundingClientRect();
    const box = panel.getBoundingClientRect();
    const from = { x: e.clientX, y: e.clientY };
    const was = { x: box.left - desk.left, y: box.top - desk.top, w: box.width, h: box.height };
    for (const p of document.querySelectorAll(".panel")) p.classList.remove("up");
    panel.classList.add("up");
    document.body.classList.add("dragging");
    // Held in a variable: currentTarget is only itself during dispatch, and by
    // the time the pointer comes up again it is null.
    const handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);

    const move = (ev) => {
      const dx = ev.clientX - from.x, dy = ev.clientY - from.y;
      if (mode === "drag") {
        // Never far enough off the desk that the handle cannot be reached.
        panel.style.left = Math.max(-was.w + 80, Math.min(desk.width - 80, was.x + dx)) + "px";
        panel.style.top = Math.max(0, Math.min(desk.height - 28, was.y + dy)) + "px";
      } else {
        panel.style.width = Math.max(220, was.w + dx) + "px";
        panel.style.height = Math.max(96, was.h + dy) + "px";
      }
    };
    const end = (ev) => {
      try { handle.releasePointerCapture(ev.pointerId); } catch { /* already gone */ }
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", end);
      handle.removeEventListener("pointercancel", end);
      document.body.classList.remove("dragging");
      remember(panel);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    e.preventDefault();
  };

  head.addEventListener("pointerdown", (e) => start(e, "drag"));
  grip.addEventListener("pointerdown", (e) => start(e, "size"));
  // Back where it started, for when he has dragged it somewhere silly.
  head.addEventListener("dblclick", () => {
    const all = deskRead();
    if (all[bucket()]) delete all[bucket()][panel.dataset.panel];
    deskWrite(all);
    place(panel);
  });
}

for (const panel of document.querySelectorAll(".panel")) {
  place(panel);
  movable(panel);
}
addEventListener("resize", () => {
  for (const panel of document.querySelectorAll(".panel")) place(panel);
});

/* ════════════════════════════════════════════════════════════════════════
   The level

   All that is left of the audio-reactive core, and the only part of it that
   was ever information: whether the microphone is actually hearing him, and
   whether she is actually making sound. A line in the dock, two pixels tall,
   present only while one of those is true.
   ════════════════════════════════════════════════════════════════════════ */
let analyser = null, ampData = null, metering = false;

function meter() {
  if (!analyser) {
    metering = false;
    level.style.transform = "scaleX(0)";
    return;
  }
  metering = true;
  analyser.getByteTimeDomainData(ampData);
  let peak = 0;
  for (let i = 0; i < ampData.length; i++) peak = Math.max(peak, Math.abs(ampData[i] - 128));
  level.style.transform = "scaleX(" + Math.min(1, peak / 70).toFixed(3) + ")";
  requestAnimationFrame(meter);
}

/** Called whenever an analyser is attached, so the line starts moving. */
const listenLevel = () => { if (!metering) requestAnimationFrame(meter); };


/* ════════════════════════════════════════════════════════════════════════
   State

   Five words, and each of them is true of something the core actually said.
   ════════════════════════════════════════════════════════════════════════ */
function setState(state, word) {
  document.body.dataset.state = state;
  stateEl.textContent = word;
}

function doing(line) {
  // Cleared out, not just faded: a line left in the DOM at zero opacity is
  // still a line a screen reader reads out as though she were still on it.
  doingEl.textContent = line || "";
  doingEl.classList.toggle("on", Boolean(line));
}

/* ════════════════════════════════════════════════════════════════════════
   What was said
   ════════════════════════════════════════════════════════════════════════ */
let open = null, pinned = true;
thread.addEventListener("scroll", () => {
  pinned = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
});
const follow = () => { if (pinned) thread.scrollTop = thread.scrollHeight; };
const enter = (el, from) => animate(el, { opacity: [0, 1], translateY: [from === undefined ? 8 : from, 0], duration: 400, ease: "outCubic" });

/** Exactly one exchange is ever at full weight. */
function recede() {
  for (const el of thread.querySelectorAll(".turn:not(.past)")) el.classList.add("past");
}

function turnEl(cls) {
  const el = document.createElement("article");
  el.className = "turn" + (cls ? " " + cls : "");
  thread.append(el);
  return el;
}

function yours(said, onscreen) {
  recede();
  const el = turnEl();
  const p = document.createElement("p");
  p.className = "you" + (onscreen ? " onscreen" : "");
  p.textContent = said;
  el.append(p);
  enter(el);
  follow();
  return el;
}

/** Her half of the exchange he is in the middle of. */
function hers() {
  if (open) return open;
  const last = thread.querySelector(".turn:last-child");
  // Attach to the line he just said, unless she is starting this herself.
  const el = last && !last.classList.contains("past") && !last.querySelector(".her")
    ? last
    : (recede(), turnEl());

  const said = document.createElement("p");
  said.className = "her";
  const caret = document.createElement("span");
  caret.className = "caret";
  said.append(caret);
  el.append(said);
  enter(said, 6);
  animate(caret, { opacity: [1, .15], duration: 620, loop: true, alternate: true, ease: "inOutSine" });

  // `raw` is what she actually sent; `words` is that with the markdown taken
  // out, which is what is drawn and what the reading head measures against.
  open = { el, said, caret, startedAt: Date.now(), firstDelta: 0, raw: "", words: "", spoken: 0, emitted: 0, spans: [], steps: [] };
  // Last turn's unspoken ranges belong to text that is no longer the live one.
  roomHead();
  roomSaid.length = 0;
  cutSpeaking = false; // a new reply gets a clean voice, whatever happened to the last
  setState("working", "working");
  follow();
  return open;
}

/* ── what she did, in words ───────────────────────────────────────────────
   A tool line is a verb and an object: "Read core.ts", "Bash npm test",
   "gws-calendar +agenda". Counted by verb they become a sentence, which is
   what he actually wants to know after the fact — "read two files and ran a
   command" rather than a column of tool names. The counts are real, because
   a summary that rounds off what she touched is worse than no summary. */
function stepKind(line) {
  const v = line.trim().split(/[\s(]/)[0].toLowerCase();
  if (/^(read|cat|head|tail|open|notebookread)$/.test(v)) return "read";
  if (/^(write|edit|multiedit|notebookedit)$/.test(v)) return "changed";
  if (/^(grep|glob|find|search)$/.test(v)) return "searched";
  if (/^(bash|powershell|shell|npm|git|run)$/.test(v)) return "ran";
  if (/^(webfetch|websearch|curl)$/.test(v) || v.includes("reach")) return "web";
  if (/^(remember|recall|forget)$/.test(v)) return "memory";
  if (/^(launch_app|media_control|list_windows|browser_history)$/.test(v)) return "desktop";
  if (/^(watch|list_watches|resolve_watch)$/.test(v)) return "watch";
  if (/^(show_screen|clear_screen)$/.test(v)) return "screen";
  if (v.startsWith("gws-calendar")) return "calendar";
  if (v.startsWith("gws-gmail")) return "mail";
  if (v.startsWith("gws-")) return "google";
  return "other";
}

const NUMBER = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
const count = (n) => (n < NUMBER.length ? NUMBER[n] : String(n));

function phraseFor(kind, n) {
  const many = n > 1;
  switch (kind) {
    case "read": return "read " + count(n) + (many ? " files" : " file");
    case "changed": return "changed " + count(n) + (many ? " files" : " file");
    case "searched": return many ? "searched " + count(n) + " times" : "searched";
    case "ran": return "ran " + count(n) + (many ? " commands" : " command");
    case "web": return many ? "looked " + count(n) + " things up" : "looked something up";
    case "memory": return many ? "went through her memory" : "checked her memory";
    case "desktop": return "used the desktop";
    case "watch": return many ? "sorted the watches" : "set a watch";
    case "screen": return "put something on screen";
    case "calendar": return "checked your calendar";
    case "mail": return "checked your mail";
    case "google": return "used your Google account";
    default: return count(n) + (many ? " other things" : " other thing");
  }
}

function inWords(lines) {
  const tally = new Map();
  for (const line of lines) {
    const kind = stepKind(line);
    tally.set(kind, (tally.get(kind) || 0) + 1);
  }
  const groups = [...tally].sort((a, b) => b[1] - a[1]);
  const said = groups.slice(0, 3).map(([kind, n]) => phraseFor(kind, n));
  const rest = groups.slice(3).reduce((sum, [, n]) => sum + n, 0);
  if (rest) said.push(count(rest) + " more");
  if (said.length === 1) return said[0];
  return said.slice(0, -1).join(", ") + " and " + said[said.length - 1];
}

/* How many of them are worth building. Thirty nodes under every exchange, in
   a page he leaves open for days, is a cost nobody reads the bottom of. The
   rest are one click away and are not built until he asks. */
const RECENT_STEPS = 7;

/* The verb, for the eye. "Read" and "Write" are what he is scanning for, so
   they lead the line and the object follows in whatever form the tool gave. */
function splitStep(line) {
  const at = line.indexOf(" ");
  return at < 0 ? [line, ""] : [line.slice(0, at), line.slice(at + 1)];
}

/**
 * Something actually changed. That is the half of the work he watches for.
 *
 * Not memory: `recall` is a read and shares a kind with `remember`, so
 * marking the family would light up looking something up as though she had
 * altered it.
 */
const CHANGED = new Set(["changed", "screen"]);

/**
 * The Work panel exists while there is work, and only then.
 *
 * It arrives on the first tool call of a turn rather than on "working",
 * because most turns are her thinking and answering and an empty panel would
 * be furniture moved for nothing. It leaves when the turn does — gently, so
 * the last step is seen going rather than vanishing mid-glance — and an
 * error or a dropped stream takes it down the same way, so a dead turn's
 * steps can never stand into the next one.
 *
 * `era` guards the crossing: a hide is 240ms long, and a new turn's first
 * tool inside that window must win or the panel would clear itself moments
 * after arriving.
 */
let worksEra = 0;

/* Kept open on purpose, remembered across reloads. Default is the panel that
   comes and goes with the work; pinned, it stays put so he can watch a run
   from the same place every time. */
const KEEP = "vela.keepwork";
let worksPinned = false;
try { worksPinned = localStorage.getItem(KEEP) === "1"; } catch { worksPinned = false; }

function showWorks() {
  ++worksEra; // any hide still in flight loses
  if (worksPanel.classList.contains("on")) return;
  worksPanel.classList.add("on");
  worksPanel.style.opacity = "";
  animate(worksPanel, { opacity: [0, 1], translateY: [10, 0], duration: 380, ease: "outCubic" });
}

function hideWorks() {
  const era = ++worksEra;
  const gone = () => {
    if (era !== worksEra) return; // a new turn got here first
    worksPanel.classList.remove("on");
    worksPanel.style.opacity = "";
    works.replaceChildren();
    worksCount.textContent = "";
  };
  if (!worksPanel.classList.contains("on")) return gone();
  const going = animate(worksPanel, { opacity: [1, 0], translateY: [0, 6], duration: 240, ease: "inQuad" });
  if (going && going.then) going.then(gone);
  else gone();
}

/* The turn is over. Pinned, the panel and its steps stand as the record of
   what she just did, until the next turn's first tool clears them; unpinned,
   it leaves the way it came. */
function endWorks() {
  if (worksPinned) return;
  hideWorks();
}

function setKeep(on) {
  worksPinned = on;
  worksKeep.setAttribute("aria-pressed", String(on));
  try { localStorage.setItem(KEEP, on ? "1" : ""); } catch { /* private window */ }
  if (on) showWorks();
  else if (!open) hideWorks(); // let it go now, unless a turn is mid-flight
}

worksKeep.addEventListener("click", () => setKeep(!worksPinned));
if (worksPinned) setKeep(true);

function tool(lines) {
  const t = hers();
  // First tool of a fresh turn: a pinned panel still showing the last turn's
  // steps starts clean rather than piling this turn on top of the last.
  if (!t.worksStarted) {
    t.worksStarted = true;
    if (worksPinned) { works.replaceChildren(); worksCount.textContent = ""; }
  }
  showWorks();
  for (const line of lines) {
    t.steps.push(line);
    const kind = stepKind(line);
    const made = CHANGED.has(kind);

    const li = document.createElement("li");
    const [verb, rest] = splitStep(line);
    li.dataset.verb = verb;
    li.textContent = rest;
    li.title = line;
    if (made) li.classList.add("made");
    works.append(li);
    // It is a window on the last few, not a log. The turn keeps all of them.
    while (works.children.length > LIVE_STEPS) works.firstChild.remove();
    worksCount.textContent = t.steps.length + (t.steps.length === 1 ? " step" : " steps");
    // The newest step is the one he is watching, so keep it in view.
    works.scrollTop = works.scrollHeight;
    animate(li, { opacity: [0, 1], translateY: [6, 0], duration: 260, ease: "outQuad" });
  }
  doing(lines[lines.length - 1]);
  follow();
}

/** How many steps stand in the field at once while she is working. */
const LIVE_STEPS = 9;

/* ── markdown ─────────────────────────────────────────────────────────────
   She writes plain sentences in conversation and markdown when she is doing
   real work, and both arrive here. Set in the display serif, `**like this**`
   reads as broken rather than as emphasis, and handed to Kokoro it is read
   out loud as asterisks.

   Two cleanings, because the eye and the ear want different things: the eye
   wants the code kept and the markers gone, the ear wants to be told there
   was code and to move on. Mirrors speakable() in voice.ts. */

/**
 * How much of a streaming reply is safe to strip.
 *
 * A pair of markers is only a pair once the second half has arrived, so
 * `**bol` is not emphasis yet and stripping it would take away a marker that
 * turns out to be literal. Everything from the last unclosed marker onward
 * waits for the rest.
 */
function settledUpto(raw) {
  let i = 0, open = null, opened = 0;
  while (i < raw.length) {
    const two = raw.slice(i, i + 2);
    if (!open && two === "**") { open = "**"; opened = i; i += 2; continue; }
    if (open === "**" && two === "**") { open = null; i += 2; continue; }
    if (!open && raw[i] === "`") { open = "`"; opened = i; i += 1; continue; }
    if (open === "`" && raw[i] === "`") { open = null; i += 1; continue; }
    i++;
  }
  return open ? opened : raw.length;
}

/** For the eye: the markers go, everything they were wrapped around stays. */
function forReading(text) {
  // Her spoken line is marked in the text she writes; the marks are for the
  // room, not for him.
  return text
    .split("<say>").join("")
    .split("</say>").join("")
    // A tag arrives in pieces: the stream has been seen to hand over "<say"
    // and ">Two things." as two chunks. Left in, that "<say" renders as a word
    // for one chunk and then vanishes, and every span offset after it shifts —
    // which is the reading head losing its place. Bounded to five so a real
    // angle bracket in her prose comes back on the next chunk.
    .replace(/<[^>]{0,5}$/, "")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
}

/** For the ear: the same, plus the things that only make sense on a page. */
function forSaying(text) {
  return text
    .replace(/```[\s\S]*?```/g, " code block. ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " a link ")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/^\s*[-*]\s+/gm, "")
    .replace(/[A-Za-z]:[\\/][\w.\-\\/ ]+[\\/]([\w.\-]+)/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

/**
 * Set the words that have landed, one span each.
 *
 * The last token is held back until whitespace follows it, because a word
 * half-arrived is a word spelling itself out, and that reads as a stutter
 * rather than as speech. Each span remembers where it sits in the reply, which
 * is what lets the audio light it later.
 */
function renderWords(t, final) {
  const tokens = t.words.split(/(\s+)/);
  const upto = final ? tokens.length : tokens.length - 1;
  let at = 0;
  for (let i = 0; i < upto; i++) {
    const tok = tokens[i];
    const start = at;
    at += tok.length;
    if (i < t.emitted || !tok) continue;
    if (/^\s+$/.test(tok)) {
      t.said.insertBefore(document.createTextNode(tok), t.caret);
      continue;
    }
    const span = document.createElement("span");
    span.className = "w";
    span.textContent = tok;
    t.said.insertBefore(span, t.caret);
    t.spans.push({ el: span, start, end: at });
    animate(span, { opacity: [0, 1], filter: ["blur(4px)", "blur(0px)"], duration: 280, ease: "outQuad" });
  }
  t.emitted = Math.max(t.emitted, upto);
}

function delta(chunk) {
  const t = hers();
  if (!t.firstDelta) t.firstDelta = Date.now();
  t.raw += chunk;
  // Only the part with no half-written marker in it. The rest is one chunk
  // away and drawing it now would show a `**` that is about to disappear.
  t.words = forReading(t.raw.slice(0, settledUpto(t.raw)));
  renderWords(t);
  speakReady(t);
  follow();
}

function done(ms, fallback) {
  const t = open;
  if (!t) return;
  if (fallback && !t.raw) t.raw = fallback;
  // Nothing more is coming, so the marker that never closed was literal.
  t.words = forReading(t.raw);
  renderWords(t, true);
  t.caret.remove();
  speakRest(t);
  doing("");
  endWorks();

  const total = ms || Date.now() - t.startedAt;
  if (t.steps.length) {
    const list = document.createElement("ul");
    list.className = "stepped";
    list.hidden = true;

    const shown = t.steps.slice(-RECENT_STEPS);
    const earlier = t.steps.slice(0, t.steps.length - shown.length);
    const put = (line, before) => {
      const li = document.createElement("li");
      li.textContent = line;
      list.insertBefore(li, before || null);
      return li;
    };
    for (const line of shown) put(line);

    // Older than the last few: named, counted, and built only if he asks.
    if (earlier.length) {
      const more = document.createElement("li");
      const link = document.createElement("button");
      link.type = "button";
      link.className = "steps";
      link.textContent = count(earlier.length) + " more before that";
      link.addEventListener("click", () => {
        for (const line of earlier) put(line, more);
        more.remove();
        follow();
      });
      more.append(link);
      list.insertBefore(more, list.firstChild);
    }

    const button = document.createElement("button");
    button.type = "button";
    button.className = "steps";
    // Non-breaking, so a long summary never wraps between the dot and the
    // time and leaves "96.0s" stranded on a line of its own.
    button.textContent = inWords(t.steps) + " · " + (total / 1000).toFixed(1) + "s";
    button.addEventListener("click", () => {
      list.hidden = !list.hidden;
      follow();
    });
    t.el.append(button, list);
  } else {
    const took = document.createElement("p");
    took.className = "took";
    took.textContent = (total / 1000).toFixed(1) + "s";
    t.el.append(took);
  }

  open = null;
  if (!speakingNow) setState("idle", "with you");
  follow();
}

/** She started this one. It should reach him without behaving like a website. */
function unbidden(said) {
  recede();
  const el = turnEl("unbidden");
  const when = document.createElement("span");
  when.className = "when";
  const now = new Date();
  when.textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const p = document.createElement("p");
  p.className = "her";
  p.textContent = said;
  el.append(when, p);
  animate(el, { opacity: [0, 1], translateX: [-10, 0], duration: 520, ease: "outCubic" });
  if (speaking) enqueue(said);
  if (phone() && document.body.dataset.memory === "on") memory(false);
  follow();
}

function hitch(message) {
  const el = turnEl();
  const p = document.createElement("p");
  p.className = "hitch";
  p.textContent = message;
  el.append(p);
  enter(el);
  follow();
}

/* ════════════════════════════════════════════════════════════════════════
   The stage

   She writes a page and shows it; it lands here. The iframe's URL carries a
   screen-scoped key, minted per show, that opens /screen/file and nothing
   else — the master token never enters a page she wrote. Anything inside can
   call parent.postMessage({ vela: "..." }, "*") and it reaches her as words.
   ════════════════════════════════════════════════════════════════════════ */
function showScreen(meta, quiet) {
  screenUp = meta || null;
  if (!screenUp) {
    stageFrame.removeAttribute("src");
    document.body.removeAttribute("data-stage");
    stageHidden = false;
      return;
  }
  stageTitle.textContent = screenUp.title;
  stageNote.textContent = screenUp.note || "";
  stageFrame.src = "/screen/file?s=" + encodeURIComponent(screenUp.s || "");
  stageHidden = false;
  document.body.dataset.stage = "on";
  if (phone()) memory(false);
  animate(stage, { opacity: [0, 1], duration: 460, ease: "outCubic" });
  if (!quiet) follow();
}

/* Put it away, here and everywhere.
 *
 * It used to hide locally and leave it standing on the service, so the next
 * page to open asked what was up and got the thing he had just closed. Closing
 * something twice is not a gesture anyone should have to make. */
function stageAway() {
  stageHidden = true;
  document.body.removeAttribute("data-stage");
  fetch("/screen/clear", { method: "POST", headers: auth })
    .then(() => { screenUp = null; stageFrame.removeAttribute("src"); })
    .catch(() => {});
}

stageShut.addEventListener("click", stageAway);

/* What he does on her page comes back as words. Only from the stage's own
   window, only a string, and never more than a sentence's worth. */
addEventListener("message", (e) => {
  if (!screenUp || !stageFrame.contentWindow || e.source !== stageFrame.contentWindow) return;
  const said = e.data && typeof e.data.vela === "string" ? e.data.vela.trim().slice(0, 500) : "";
  if (!said) return;
  yours(said, true);
  deliver("[He did this on the screen: " + said + "]");
});

/* ════════════════════════════════════════════════════════════════════════
   Her voice: the same Kokoro the terminal uses
   ════════════════════════════════════════════════════════════════════════ */
let speaking = false, canSpeak = false, speakingNow = false;

/**
 * Show the stop key exactly while she has something to be stopped saying.
 *
 * Both voices count: `aloud` is her speaking in the room, `speakingNow` is
 * this page playing her. Derived rather than set at each site, because the two
 * overlap at the edges of a turn and a control that lingers after she has
 * finished is one that does nothing when pressed.
 */
function drawStop() {
  stopKey.hidden = !(aloud || speakingNow);
}
/* She is saying this one out loud in the room already. The service tells us so,
   because a tab has no way of knowing there is a microphone in front of it, and
   two of her talking at once is worse than neither. Cleared on reconnect: a
   stream that dropped mid-reply must not leave this tab mute for good. */
let aloud = false;
/**
 * Whether she is in a room, and what its two switches are set to.
 *
 * A service with a microphone and speakers of its own already has one voice
 * and one pair of ears. This page used to bring a second of each and keep them
 * in step by announcement, which is how two of her ended up answering. When
 * there is a room, these buttons drive it: the microphone is hers, the voice
 * is hers, and the hub is where he reaches them. With no room — a service that
 * cannot hear or speak for itself — the browser's own are all there is, and
 * the buttons work exactly as they always did.
 */
let inRoom = false, roomHearing = true, roomSpeaking = true;

/* Sentences she is going to say in the room, in the order this page split
   them, each with where it sits in her words. Filled by enqueue, emptied by
   the "saying" events as her voice actually reaches them. */
let roomSaid = [];
/* Ends the sweep running now. Reassigned by each one; a no-op before the
   first. */
let roomHead = () => {};

/* Reduce to the letters, which is all the two sides agree on: what the room
   speaks has been through speakable() and what is on screen has been through
   forReading(), so punctuation, markdown and URLs differ by design. */
const bare = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "");

/**
 * The range the room has just started saying.
 *
 * Normally the front of the queue: both sides split the same text with the
 * same rules, so the orders agree. The search is for when they do not — one
 * side collapsing a clause the other kept — where taking the front regardless
 * would put the head on the wrong sentence and leave it wrong for the rest of
 * the turn. Looking a few ahead resyncs instead, and dropping what it skipped
 * is right: those sentences were never spoken.
 */
function roomNext(text) {
  const want = bare(text).slice(0, 16);
  if (!want) return roomSaid.shift() || null;
  for (let i = 0; i < roomSaid.length && i < 4; i++) {
    if (bare(roomSaid[i].said).slice(0, 16) === want) return roomSaid.splice(0, i + 1).pop();
  }
  return roomSaid.shift() || null;
}

/**
 * The reading head, on the room's clock rather than an audio element's.
 *
 * sweep() follows currentTime on the audio this page is playing. There is no
 * such audio in a room, so this follows wall time from the moment the room
 * said it had started, across the real length of the samples. It is the same
 * approximation as sweep() — a sentence's duration spread over its characters
 * — and it stops where she stops, because being cut off clears the queue and
 * the next call ends this one.
 */
function sweepRoom(item, ms) {
  roomHead();
  if (!item || !item.spans || !item.range || !ms) return;
  const [from, to] = item.range;
  const width = to - from;
  const mine = item.spans.filter((s) => s.start >= from && s.end <= to);
  if (!mine.length || !width) return;

  const began = performance.now();
  let alive = true;
  (function tick() {
    if (!alive) return;
    requestAnimationFrame(tick);
    const head = from + Math.min(1, (performance.now() - began) / ms) * width;
    for (const s of mine) {
      s.el.classList.toggle("saying", s.start <= head && head < s.end);
      s.el.classList.toggle("said", s.end <= head);
    }
  })();

  roomHead = () => {
    alive = false;
    for (const s of mine) s.el.classList.remove("saying");
  };
}

let audioQueue = [], playing = false, current = null, sound = null;
// The teardown for the sentence sounding right now, so hush() can end it the
// same way it would end on its own rather than pausing it half-alive.
let stopCurrent = null;
// She has been cut off this turn. Blocks the rest of a streaming reply from
// being spoken over his recording; cleared when the next reply begins.
let cutSpeaking = false;

/**
 * A browser starts an AudioContext suspended unless it was made during a real
 * click, and routing an element through a suspended one is silence with no
 * error to show for it. Built on the button press; every caller checks it is
 * genuinely running before attaching anything.
 */
function ears() {
  if (!sound) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { sound = new Ctx(); } catch { return null; }
  }
  if (sound.state === "suspended") sound.resume().catch(() => {});
  return sound;
}
function liveEars() {
  const ctx = ears();
  return ctx && ctx.state === "running" ? ctx : null;
}

/* The same graded pause the terminal uses, so both faces breathe alike. A
   clause is barely a beat, a question hangs, a paragraph is a proper stop.
   Mirrors gapFor() in voice.ts. */
function gapAfter(said, base) {
  const end = said.trimEnd().slice(-1);
  const scale = /\n/.test(said.slice(-2)) ? 2.6
    : end === "?" || end === "!" ? 1.6
    : end === "." ? 1.15
    : end === "," || end === ";" || end === ":" ? 0.7
    : 0.75;
  let n = 0;
  for (let i = 0; i < said.length; i++) n = (n * 31 + said.charCodeAt(i)) >>> 0;
  return Math.round((base || 150) * scale * (0.85 + (n % 30) / 100));
}

/* Break a long sentence at its clauses, so each one gets its own beat. Handed
   over whole, a three-clause sentence is synthesised as one unbroken run and
   the pauses above never fire inside it. Mirrors clauses() in voice.ts, but
   carries character offsets because the reading head sweeps by range. */
const CLAUSE_MIN_WORDS = 3, CLAUSE_MIN_CHARS = 70;
function countWords(s) { return s.trim().split(/\s+/).filter(Boolean).length; }
function clausesOf(body, from) {
  if (body.trim().length < CLAUSE_MIN_CHARS || body.includes("```")) {
    return [[body, from, from + body.length]];
  }
  const out = [];
  let at = 0;
  for (;;) {
    const cut = /[,;:]\s/.exec(body.slice(at));
    if (!cut) break;
    const end = at + cut.index + 1;
    const head = body.slice(at, end), tail = body.slice(end + cut[0].length - 1);
    if (countWords(head) < CLAUSE_MIN_WORDS || countWords(tail) < CLAUSE_MIN_WORDS) break;
    out.push([head, from + at, from + end]);
    at = end + cut[0].length - 1;
  }
  if (at < body.length) out.push([body.slice(at), from + at, from + body.length]);
  return out.length ? out : [[body, from, from + body.length]];
}

async function enqueue(sentence, range) {
  // What reaches Kokoro is the spoken form, so she never reads a backtick or
  // a URL out loud. The range stays in the coordinates of what is on screen,
  // which is what the reading head sweeps across.
  const said = forSaying(sentence).trim();
  if (!said) return;
  /* In a room she says this herself, so the page renders no audio for it. It
     still keeps the range: the reading head is the only thing on screen that
     shows where her voice has got to, and losing it was the cost of moving the
     voice out of the browser. What it lacks is a clock, and the room sends one
     — see the "saying" event. */
  if (inRoom) {
    if (range && open) roomSaid.push({ said, range, spans: open.spans });
    return;
  }
  if (!canSpeak || !speaking || cutSpeaking || aloud) return;
  audioQueue.push({ said, range: range || null, spans: (open && open.spans) || null });
  if (!playing) drainAudio();
}

/**
 * The reading head.
 *
 * Kokoro returns a wav and no word timings, so the sweep is proportional:
 * the audio's own duration spread across the characters of the sentence it
 * came from. It is an approximation, and at one sentence at a time it is close
 * enough to track by eye. It follows the real clock of the real audio, so it
 * stops dead when she is cut off rather than finishing without her.
 */
function sweep(el, item) {
  if (!item.spans || !item.range) return () => {};
  const [from, to] = item.range;
  const width = to - from;
  const mine = item.spans.filter((s) => s.start >= from && s.end <= to);
  if (!mine.length || !width) return () => {};

  let alive = true;
  (function tick() {
    if (!alive) return;
    requestAnimationFrame(tick);
    const d = el.duration;
    if (!d || !isFinite(d)) return;
    const head = from + (el.currentTime / d) * width;
    for (const s of mine) {
      const on = s.start <= head && head < s.end;
      const gone = s.end <= head;
      s.el.classList.toggle("saying", on);
      s.el.classList.toggle("said", gone);
    }
  })();

  return () => {
    alive = false;
    for (const s of mine) s.el.classList.remove("saying");
  };
}

async function drainAudio() {
  playing = true;
  let first = true;
  while (audioQueue.length && speaking) {
    const item = audioQueue.shift();
    const said = item.said;
    // Never before the opening sentence, which is the one he is waiting on.
    if (!first) await new Promise((r) => setTimeout(r, gapAfter(said, 150)));
    first = false;
    try {
      const res = await fetch("/speak", { method: "POST", headers: json, body: JSON.stringify({ text: said }) });
      if (!res.ok) continue;
      const url = URL.createObjectURL(await res.blob());
      await new Promise((finish) => {
        const a = new Audio(url);
        current = a;
        // A field that does not move is a small loss. A voice that does not
        // play is the whole feature, so the tap is optional and playback is not.
        const ctx = liveEars();
        if (ctx) {
          try {
            const src = ctx.createMediaElementSource(a);
            const an = ctx.createAnalyser();
            an.fftSize = 512;
            src.connect(an);
            an.connect(ctx.destination);
            analyser = an;
            ampData = new Uint8Array(an.frequencyBinCount);
            listenLevel();
          } catch { analyser = null; }
        }
        speakingNow = true;
        drawStop();
        setState("speaking", "speaking");
        const stopSweep = sweep(a, item);
        let done = false;
        const end = () => {
          if (done) return;         // hush and onended can both land; run once
          done = true;
          stopSweep();
          try { URL.revokeObjectURL(url); } catch { /* already gone */ }
          if (current === a) current = null;
          if (analyser) { analyser = null; }
          stopCurrent = null;
          finish();
        };
        // What hush calls: the same teardown, plus stopping the audio itself.
        stopCurrent = () => { try { a.pause(); } catch { /* not playing */ } a.onended = a.onerror = null; end(); };
        a.onended = a.onerror = end;
        a.play().catch(end);
      });
    } catch { /* a sentence that would not render is skipped, not fatal */ }
  }
  playing = false;
  speakingNow = false;
  drawStop();
  analyser = null;
  // Only when she was the last thing on screen: a barge-in has already moved
  // the state to listening, and finishing here would stamp idle back over it.
  if (!open && document.body.dataset.state === "speaking") setState("idle", "with you");
}

/**
 * Stop her mid-sentence.
 *
 * The bug this fixes: pausing the audio without running its teardown left the
 * playback promise in drainAudio awaiting for ever, so the state stuck on
 * "speaking", the reading head kept re-lighting the cut-off word, and the wav
 * blob never freed. Now it runs the very teardown the sentence would have run
 * on its own. `cut` means he talked over her: her remaining sentences this
 * turn are dropped rather than played into his open microphone.
 */
function hush(cut) {
  audioQueue = [];
  if (cut) cutSpeaking = true;
  if (stopCurrent) stopCurrent();
  else if (current) { try { current.pause(); } catch {} current = null; }
  // Belt and suspenders: the sweep clears its own, but a queued sentence that
  // never started playing has no sweep to do it.
  for (const el of document.querySelectorAll(".w.saying")) el.classList.remove("saying");
  playing = false;
  speakingNow = false;
  drawStop();
  analyser = null;
}

const ENDS = /[.!?]["')\]]?(\s|$)/g;
function speakReady(t) {
  // In a room this earns its keep by splitting alone: enqueue takes the ranges
  // and plays nothing.
  if (!speaking && !inRoom) return;
  ENDS.lastIndex = 0;
  let cut = -1, m;
  while ((m = ENDS.exec(t.words))) cut = m.index + m[0].length;
  if (cut > t.spoken) {
    for (const [piece, from, to] of clausesOf(t.words.slice(t.spoken, cut), t.spoken)) {
      enqueue(piece, [from, to]);
    }
    t.spoken = cut;
  }
}
function speakRest(t) {
  if ((speaking || inRoom) && t.words.length > t.spoken) {
    for (const [piece, from, to] of clausesOf(t.words.slice(t.spoken), t.spoken)) {
      enqueue(piece, [from, to]);
    }
    t.spoken = t.words.length;
  }
}

/* "She is about to need this." Her speech models are held back until first
   use, so an idle Vela is ~430MB rather than 1.5GB. Saying so at the gesture
   rather than at the sentence is what keeps that free: the load happens while
   he is still talking, or still reading. */
function warm(what) {
  fetch("/warm", { method: "POST", headers: json, body: JSON.stringify({ what: what }) }).catch(() => {});
}

earKey.addEventListener("click", () => {
  // In a room she has a voice of her own and this governs it. The page stays
  // silent either way, which is what makes a second of her impossible rather
  // than merely unlikely.
  if (inRoom) { setRoom({ speaking: !roomSpeaking }); return; }
  speaking = !speaking;
  earKey.setAttribute("aria-pressed", String(speaking));
  // Inside the click, because this is the gesture the browser wants before it
  // will let the page make noise.
  if (speaking) { ears(); warm("voice"); }
  else hush();
});

/* ════════════════════════════════════════════════════════════════════════
   His voice
   ════════════════════════════════════════════════════════════════════════ */
let recorder = null, chunks = [], canHear = false, cutOff = false, micStream = null;


/* Mute is a state, not an action, so both buttons have to read as one. */
function drawRoom() {
  if (!inRoom) return;
  micKey.setAttribute("aria-pressed", String(roomHearing));
  micKey.classList.toggle("hot", roomHearing);
  micKey.title = roomHearing ? "She can hear you. Mute." : "Muted. Let her hear you.";
  micKey.setAttribute("aria-label", micKey.title);
  earKey.setAttribute("aria-pressed", String(roomSpeaking));
  earKey.title = roomSpeaking ? "She answers out loud. Mute her." : "Muted. Let her answer out loud.";
  earKey.setAttribute("aria-label", earKey.title);
}

/* The server owns both switches; this page only asks. Taking the reply as the
   truth rather than assuming the click landed keeps the two in step when a
   request fails or something else has already changed them. */
async function setRoom(want) {
  try {
    const res = await fetch("/room", { method: "POST", headers: json, body: JSON.stringify(want) });
    if (!res.ok) throw new Error(String(res.status));
    const now = await res.json();
    roomHearing = Boolean(now.hearing);
    roomSpeaking = Boolean(now.speaking);
    drawRoom();
  } catch {
    hitch("Could not reach her microphone.");
  }
}

async function startListening() {
  /* Talking over her is an answer in itself: she has said enough. Stop her
     mid-word, and remember it so the next turn carries the reason. */
  if (speakingNow || audioQueue.length) { hush(true); cutOff = true; }

  // Whisper loads while he is still talking, which is the whole gap it needs.
  warm("ears");

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(micStream);
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onHeard;
    recorder.start();

    // Nothing is routed through the context here, so a suspended one costs the
    // drawing and never the recording.
    const ctx = liveEars();
    if (ctx) {
      try {
        const an = ctx.createAnalyser();
        an.fftSize = 512;
        ctx.createMediaStreamSource(micStream).connect(an);
        analyser = an;
        ampData = new Uint8Array(an.frequencyBinCount);
        listenLevel();
      } catch { analyser = null; }
    }

    micKey.classList.add("hot");
    setState("listening", "listening");
  } catch {
    hitch("The browser would not open the microphone. Check its permission for this page.");
  }
}

async function onHeard() {
  micStream && micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
  analyser = null;
  micKey.classList.remove("hot");
  setState("working", "hearing");
  try {
    const res = await fetch("/hear", { method: "POST", headers: auth, body: new Blob(chunks) });
    const { text: heard } = await res.json();
    if (heard && heard.trim()) say(heard.trim());
    else { setState("idle", "with you"); hitch("Nothing came through on that one."); }
  } catch {
    setState("idle", "with you");
    hitch("Could not send that recording.");
  }
}

micKey.addEventListener("click", () => {
  // In a room this is a mute, not a record button: she is already listening,
  // and this says whether she is allowed to.
  if (inRoom) { setRoom({ hearing: !roomHearing }); return; }
  if (recorder && recorder.state === "recording") recorder.stop();
  else startListening();
});

/* ════════════════════════════════════════════════════════════════════════
   The wire
   ════════════════════════════════════════════════════════════════════════ */
/**
 * A turn that will never finish, closed out honestly.
 *
 * The stream is the only way a turn ends, so if it drops while she is
 * answering, the result lands in a socket nobody is holding and the page waits
 * for ever: caret blinking, tool line stuck in the rail, no reply coming. Left
 * alone it looks exactly like her thinking, which is the worst thing it could
 * look like. Whatever words did arrive are kept — they were really said.
 */
function abandon(why) {
  const t = open;
  if (!t) return;
  renderWords(t, true);
  t.caret.remove();
  doing("");
  endWorks();
  const note = document.createElement("p");
  note.className = "took";
  note.textContent = why;
  t.el.append(note);
  open = null;
  setState("idle", "with you");
  follow();
}

/* He has let her go, so take her off his screen.

   Every hub obeys this, not a chosen one. Telling her windows from his needed
   an id in the address bar, and that made the link different every time, which
   is the one thing the pinned link cannot survive.

   window.close() is a request, not a guarantee. A page may only close itself
   where it has no history to go back to, which this one does satisfy — the key
   leaves the address bar by replaceState rather than a navigation — but that is
   the browser's call, and Firefox refuses outright. So say goodbye on screen
   first: if the window does go, nobody reads it, and if it stays, he is looking
   at a page that knows the conversation ended rather than one frozen mid-reply
   pretending to still be listening. */
function farewell() {
  setState("idle", "goodbye");
  window.close();
}

function listen() {
  const events = new EventSource("/events?k=" + encodeURIComponent(KEY));
  let dropped = false;
  events.onopen = () => {
    // Back after a drop. Anything she was saying went with it, and a service
    // that restarted is a different session from the one this page was
    // talking to, so the turn is not coming back either way.
    if (dropped) abandon(open ? "lost her mid-answer, the connection dropped" : "");
    dropped = false;
    // A service that restarted is not speaking into the room any more, whatever
    // it was doing when the stream went. Never inherit its silence.
    aloud = false;
    drawStop();
    if (!open && !speakingNow) setState("idle", "with you");
  };
  events.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === "aloud") { aloud = Boolean(ev.value); drawStop(); }
    else if (ev.type === "activity") tool(ev.lines || []);
    else if (ev.type === "delta") delta(ev.text || "");
    else if (ev.type === "result") done(ev.ms, ev.text);
    else if (ev.type === "say") unbidden(ev.text || "");
    else if (ev.type === "show") showScreen(ev.screen);
    else if (ev.type === "saying") sweepRoom(roomNext(ev.text || ""), ev.ms || 0);
    else if (ev.type === "dismissed") farewell();
    else if (ev.type === "error") { hitch(ev.message || "Something went wrong."); open = null; doing(""); endWorks(); setState("idle", "with you"); }
  };
  // It reconnects itself. Say so, because silence is also what working looks like.
  events.onerror = () => {
    dropped = true;
    setState("lost", "reaching");
  };
}

/* Hand her a turn. The line on screen is the caller's business, because a
   typed line and a click on the stage read differently. */
async function deliver(said, interrupted) {
  try {
    const res = await fetch("/turn", {
      method: "POST",
      headers: json,
      body: JSON.stringify({ text: said, cutOff: Boolean(interrupted) }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      hitch("She did not take that: " + (body.error || res.status));
    }
  } catch {
    hitch("Could not reach her. The service may have stopped.");
    setState("lost", "offline");
  }
}

async function say(said) {
  yours(said);
  const interrupted = cutOff;
  cutOff = false;
  return deliver(said, interrupted);
}

/* ════════════════════════════════════════════════════════════════════════
   The way in

   Dormant until he means to type. Typing anywhere wakes it, so the keyboard
   is the shortcut and there is nothing to learn; it collapses again once he
   is done, rather than holding the bottom of the room open all day.
   ════════════════════════════════════════════════════════════════════════ */
const typing = () => {
  const on = document.activeElement === text || text.value.length > 0;
  if (on) document.body.dataset.typing = "on";
  else document.body.removeAttribute("data-typing");
};
const grow = () => {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, innerHeight * 0.24) + "px";
};

text.addEventListener("input", () => { grow(); typing(); });
text.addEventListener("focus", typing);
text.addEventListener("blur", typing);
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); dock.requestSubmit(); }
  if (e.key === "Escape") text.blur();
});

dock.addEventListener("submit", (e) => {
  e.preventDefault();
  const said = text.value.trim();
  if (!said) return;
  if (speakingNow || audioQueue.length) { hush(true); cutOff = true; } // typing over her counts too
  text.value = "";
  grow();
  typing();
  say(said);
});

/* Enough.

   In a room the two buttons are settings — whether she may hear him at all,
   whether she answers out loud at all — and neither is what someone reaches
   for mid-sentence. This is: the key that means stop everywhere else, meaning
   stop here, about this reply only. Outside a room it is the same gesture
   against the page's own voice, which is what hush() already was. */
function enough() {
  if (!inRoom) { hush(); return; }
  // Locally first, so the head goes out on the press rather than on the round
  // trip: she is already quiet by the time the response lands.
  roomHead();
  roomSaid.length = 0;
  setRoom({ stop: true });
}

stopKey.addEventListener("click", enough);

addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  enough();
});

addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // A printable key means he has started talking to her. "/" is the same
  // intent said deliberately, and never lands in the box itself.
  if (e.key === "/") { e.preventDefault(); text.focus(); return; }
  if (e.key.length === 1) text.focus();
});

/* Memory, on a phone, is pulled up rather than left open. */
function memory(on) {
  if (on === undefined) on = document.body.dataset.memory !== "on";
  if (on) document.body.dataset.memory = "on";
  else document.body.removeAttribute("data-memory");
  pull.textContent = on ? "close" : "memory";
  if (on) follow();
}
pull.addEventListener("click", () => memory());

/* The developer half, one keystroke away and absent otherwise. She does not
   print her own pid at him all day to prove she is running. */
let probing = false;
addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  if (e.key !== "`") return;
  probing = !probing;
  probe.hidden = !probing;
});

/* On a phone the software keyboard steals half the room. Track the real
   visible viewport so the dock stays where his thumb left it. */
if (window.visualViewport) {
  const fit = () => {
    const gap = Math.max(0, innerHeight - visualViewport.height - visualViewport.offsetTop);
    document.documentElement.style.setProperty("--safe-b", gap ? gap + "px" : "env(safe-area-inset-bottom, 0px)");
  };
  visualViewport.addEventListener("resize", fit);
  visualViewport.addEventListener("scroll", fit);
}

/* ════════════════════════════════════════════════════════════════════════
   Coming up
   ════════════════════════════════════════════════════════════════════════ */

/* No key, or one she no longer accepts. Say which, and say where the real one
   lives — a page that just sits there dead is the worst of the three. */
function locked(why) {
  try { localStorage.removeItem(STORE); } catch { /* nothing to forget */ }
  setState("lost", "locked");
  lockedEl.hidden = false;
  lockedEl.innerHTML =
    "<b>She does not know this tab.</b>" + why +
    " Her link, with the key on the end of it, is printed by <code>npm run serve</code>" +
    " and kept in <code>data/server.json</code>. Open it once and this tab remembers.";
  dock.hidden = true;
}

if (!KEY) {
  locked("");
} else {
  fetch("/health", { headers: auth })
    .then((r) => {
      if (r.status === 401) { locked(" The key it had is not hers any more."); return null; }
      return r.json();
    })
    .then((h) => {
      if (!h) return;
      probe.textContent = h.name.toLowerCase() + " · pid " + h.pid;
      canHear = Boolean(h.canHear);
      canSpeak = Boolean(h.canSpeak);
      /* This tab may have opened part-way through a reply she is already
         saying out loud — the wake word opens one when she is addressed. The
         announcement that would have said so went out before this page
         existed, so the state comes from the handshake instead. Without it the
         speaker button would talk over her. */
      aloud = Boolean(h.aloud);
      drawStop();
      /* In a room, both buttons work whatever this service can do for a
         browser: they are the room's switches, not this page's. */
      inRoom = Boolean(h.room);
      if (inRoom) {
        roomHearing = Boolean(h.room.hearing);
        roomSpeaking = Boolean(h.room.speaking);
      }
      // A control that cannot work is worse than no control.
      micKey.hidden = !inRoom && !canHear;
      earKey.hidden = !inRoom && !canSpeak;
      drawRoom();
    })
    .catch(() => {});

  /* Whatever she had up survives a reload. Quiet, because the stage opening
     again is not news. */
  fetch("/screen", { headers: auth })
    .then((r) => (r.ok ? r.json() : { screen: null }))
    .then(({ screen }) => { if (screen) showScreen(screen, true); })
    .catch(() => {});

  listen();
}

// She is here before the page is, so it settles in rather than performing an
// arrival. One sequence, once.
if (A && !still) {
  A.animate(".rail > *", { opacity: [0, 1], duration: 500, delay: A.stagger(70), ease: "outCubic" });
  A.animate(".dock", { opacity: [0, 1], duration: 500, delay: 260, ease: "outCubic" });
}
</script>
</body>
</html>
