<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vela</title>
<!--
  Her mark, inline. Installed to the taskbar she needs an icon, and a file
  would mean a request that carries no key and comes back 401 — an error in
  his console every single load, for a picture. Two rings and an off-centre
  point: the same shape the field draws, small enough to read at 16px.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305090d'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%234fd1db' stroke-opacity='.32' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%234fd1db' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='16' r='1.7' fill='%23f5b95f'/%3E%3C/svg%3E">
<meta name="theme-color" content="#05090d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  The room.

  Not a page with sections: a space she is in. The whole viewport is her field,
  and the parts appear in it when they have something to carry. Nothing here is
  reserved for chat, because conversation is one of the things that happens in
  a room rather than the reason the room exists.

  Two voices only. Serif is Vela; mono is the instrument she lives inside —
  his typing, tool names, state, times. That contrast is the whole typographic
  idea and there is no third face.

  Colour is meaning, not decoration. Cyan is her working. Gold is her speaking.
  Pale is him. They are scarce on purpose: three accents on a near-black field
  say something, and the same three everywhere say nothing.
*/
:root {
  --void: #05090d;
  --ink: #e9f2f6;
  --dim: #7a929e;
  --faint: #3f525d;
  --hair: rgba(140, 190, 215, .10);
  --cyan: #4fd1db;
  --gold: #f5b95f;
  --wrong: #ff8172;

  --serif: "Instrument Serif", ui-serif, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --pad: clamp(1.1rem, 2.6vw, 2.4rem);
  --rail: 2.6rem;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .7, .3, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  min-height: 100dvh;
  background: var(--void);
  color: var(--ink);
  font: 400 15px/1.55 var(--mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Her presence is the ground everything else stands on, not a widget in a
   corner. It is painted from real amplitude and real activity; see draw(). */
#field {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.room {
  position: relative;
  z-index: 1;
  height: 100dvh;
  display: grid;
  grid-template-rows: var(--rail) minmax(0, 1fr) auto;
  grid-template-columns: 100%;
}

/* ── the rail ─────────────────────────────────────────────────────────────
   What she is doing, in as few words as it takes. Nothing lives here just
   because the value exists: no turn counts, no pid, no uptime. */
.rail {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: 0 var(--pad);
  min-width: 0;
}
.mark {
  margin: 0;
  font: 400 1.15rem/1 var(--serif);
  letter-spacing: .01em;
  flex: 0 0 auto;
}
.mark em { font-style: italic; color: var(--cyan); transition: color .7s var(--ease); }
body[data-state="speaking"] .mark em { color: var(--gold); }
body[data-state="lost"] .mark em { color: var(--faint); }

.state {
  font: 500 .62rem/1 var(--mono);
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--dim);
  flex: 0 0 auto;
}
body[data-state="working"] .state { color: var(--cyan); }
body[data-state="speaking"] .state { color: var(--gold); }
body[data-state="lost"] .state { color: var(--wrong); }

/* The tool she is in the middle of. One line, present tense, gone after. */
.doing {
  min-width: 0;
  flex: 1 1 auto;
  font: 400 .66rem/1 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity .35s var(--ease);
}
.doing.on { opacity: 1; }

.railkeys { margin-left: auto; display: flex; align-items: center; gap: .55rem; flex: 0 0 auto; }
.chip {
  border: 0;
  background: none;
  padding: .2rem 0;
  cursor: pointer;
  font: 500 .62rem/1 var(--mono);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  max-width: 42vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip[hidden] { display: none; }
.probe {
  font: 400 .6rem/1 var(--mono);
  color: var(--faint);
  letter-spacing: .04em;
}
.probe[hidden] { display: none; }

/* ── the floor ────────────────────────────────────────────────────────────
   Words on the left, her field on the right. When she puts something up, the
   material takes the right and she steps in behind the words. */
.floor {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 52ch) minmax(0, 1fr);
  gap: var(--pad);
  padding: 0 var(--pad);
  min-height: 0;
}
body[data-stage="on"] .floor { grid-template-columns: minmax(0, 34ch) minmax(0, 1fr); }

/* ── what was said ────────────────────────────────────────────────────────
   Bottom-aligned, so the newest thing sits where the eye already is and the
   rest drifts up out of the way. Faded at the top rather than cut, because a
   hard edge reads as a panel and this is meant to read as memory. */
.thread {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 1.6rem;
  padding: 2rem 0 1.2rem;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 100%);
}
.thread::-webkit-scrollbar { width: 0; }
/* Holds the newest thing at the bottom where the eye already is, and gives up
   its space the moment there is more to say than room to say it. Bottom
   alignment by justify-content makes the overflow unreachable instead. */
.fill { flex: 1 1 0; min-height: 0; }

.turn { flex: 0 0 auto; }
/* Exactly one exchange is ever at full weight. */
.turn.past { opacity: .34; }
.turn.past .her { font-size: .95rem; line-height: 1.5; }
.turn.past .steps, .turn.past .took { display: none; }

.you {
  margin: 0 0 .55rem;
  font: 400 .72rem/1.5 var(--mono);
  letter-spacing: .02em;
  color: var(--dim);
  overflow-wrap: anywhere;
}
.you::before { content: "› "; color: var(--faint); }
/* His hands on her screen, which is not the same act as typing. */
.you.onscreen::before { content: "screen › "; color: var(--gold); opacity: .75; }

.her {
  margin: 0;
  font: 400 clamp(1.25rem, 1.9vw, 1.7rem)/1.38 var(--serif);
  letter-spacing: -.004em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  transition: font-size .45s var(--ease), opacity .45s var(--ease);
}
.caret {
  display: inline-block;
  width: 1px;
  height: .82em;
  vertical-align: -.04em;
  margin-left: .08em;
  background: var(--cyan);
}

/* Each word arrives on its own and lights as it is actually spoken. The head
   is not decoration: it is where the audio has really got to. */
.w { display: inline-block; transition: color .16s var(--ease); }
.turn.past .w { transition: none; color: inherit; }
.w.saying { color: var(--gold); }
.w.said { color: var(--ink); }

/* She started this one. No line of his above it, so it gets its own edge. */
.turn.unbidden { border-left: 1px solid var(--gold); padding-left: .9rem; margin-left: -.9rem; }
.turn.unbidden .when {
  display: block;
  margin-bottom: .4rem;
  font: 500 .58rem/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
}

/* The work, folded away. Countable, reachable, and not in the way. */
.steps {
  display: block;
  margin-top: .7rem;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  font: 400 .62rem/1 var(--mono);
  letter-spacing: .06em;
  color: var(--faint);
  text-align: left;
}
.steps:hover { color: var(--dim); }
.steps[hidden] { display: none; }
.stepped {
  margin: .6rem 0 0;
  padding: 0 0 0 .9rem;
  border-left: 1px solid var(--hair);
  list-style: none;
  font: 400 .62rem/1.7 var(--mono);
  color: var(--faint);
  overflow-wrap: anywhere;
}
.stepped[hidden] { display: none; }
.took { margin-top: .5rem; font: 400 .6rem/1 var(--mono); color: var(--faint); letter-spacing: .06em; }

.hitch {
  margin: 0;
  padding-left: .8rem;
  border-left: 1px solid var(--wrong);
  color: var(--wrong);
  font: 400 .7rem/1.5 var(--mono);
  overflow-wrap: anywhere;
}

/* Nothing said yet is nothing shown. Quiet is a legitimate state and it does
   not need a sentence explaining itself. */
/* A tab she does not know. It sits where her words would, at their size and
   in their place, because it is the one thing on screen and it should read
   like her saying it rather than an error stranded in a corner. */
.locked {
  align-self: center;
  max-width: 34ch;
  margin: auto 0;
  font: 400 .74rem/1.7 var(--mono);
  color: var(--dim);
}
.locked b { display: block; margin-bottom: .6rem; font: 400 clamp(1.25rem, 1.9vw, 1.7rem)/1.38 var(--serif); color: var(--ink); }
.locked code { color: var(--cyan); font-size: .95em; }
.locked[hidden] { display: none; }

/* ── the stage ────────────────────────────────────────────────────────────
   What she pulled onto the bench between us. It takes the room; it is not a
   card sitting on top of one, so it has a hairline and no border of its own. */
.stage {
  min-width: 0;
  display: none;
  grid-template-rows: auto minmax(0, 1fr);
  padding-bottom: 1rem;
}
body[data-stage="on"] .stage { display: grid; }
.stage header {
  display: flex;
  align-items: baseline;
  gap: .8rem;
  padding: 1.5rem 0 .7rem;
  border-bottom: 1px solid var(--hair);
  min-width: 0;
}
.stage h2 { margin: 0; font: 400 1.15rem/1.3 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .note {
  margin: 0;
  font: 400 .64rem/1.4 var(--mono);
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.stage .shut {
  margin-left: auto;
  flex: 0 0 auto;
  border: 0;
  background: none;
  padding: .1rem .3rem;
  cursor: pointer;
  color: var(--faint);
  font: 400 1rem/1 var(--mono);
}
.stage .shut:hover { color: var(--ink); }
.stage iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }

/* ── the dock ─────────────────────────────────────────────────────────────
   Dormant until he means to type. A hairline and a caret is enough to say
   "there is a way in" without holding a third of the screen for it. */
.dock {
  display: flex;
  align-items: center;
  gap: .7rem;
  margin: 0 var(--pad);
  padding: .6rem 0 calc(.7rem + var(--safe-b));
  border-top: 1px solid var(--hair);
  transition: border-color .4s var(--ease);
}
body[data-typing="on"] .dock { border-top-color: rgba(79, 209, 219, .38); }
.dock::before {
  content: "›";
  color: var(--faint);
  font: 400 .8rem/1 var(--mono);
  flex: 0 0 auto;
  transition: color .3s var(--ease);
}
body[data-typing="on"] .dock::before { color: var(--cyan); }

.dock textarea {
  flex: 1 1 auto;
  min-width: 0;
  height: 1.5rem;
  max-height: 24vh;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: 400 .84rem/1.5 var(--mono);
  resize: none;
  overflow-y: auto;
  scrollbar-width: none;
}
.dock textarea::-webkit-scrollbar { width: 0; }
.dock textarea:focus { outline: none; }
.dock textarea::placeholder { color: var(--faint); }

.key {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1.9rem;
  height: 1.9rem;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  color: var(--faint);
  transition: color .2s var(--ease);
}
.key:hover { color: var(--ink); }
.key:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
.key[hidden] { display: none; }
.key svg { width: 1rem; height: 1rem; fill: currentColor; }
.key[aria-pressed="true"] { color: var(--gold); }
.key.hot { color: var(--ink); }
.send {
  width: auto;
  padding: 0 .1rem;
  font: 500 .62rem/1 var(--mono);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--cyan);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease);
}
body[data-typing="on"] .send { opacity: 1; pointer-events: auto; }

/* The handle that pulls memory up. Only earns its place on a phone, where the
   thread is not on screen to begin with. */
.pull {
  display: none;
  position: absolute;
  top: -1.5rem;
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  background: none;
  padding: .35rem 1.4rem;
  cursor: pointer;
  color: var(--faint);
  font: 500 .56rem/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
}

/* ── narrow ───────────────────────────────────────────────────────────────
   Not the desk folded up. A different body for the same intelligence: her
   state, the one thing that matters now, and a way to answer. Memory is
   pulled up when he wants it rather than filling the screen by default. */
@media (max-width: 860px) {
  :root { --rail: 2.4rem; }
  .floor { grid-template-columns: 100%; padding: 0 var(--pad); }
  body[data-stage="on"] .floor { grid-template-columns: 100%; }

  /* Her field is the centre; words sit low in it and stay short. */
  .thread {
    padding: 1rem 0 .6rem;
    gap: 1.1rem;
    max-height: 100%;
  }
  .her { font-size: clamp(1.15rem, 5vw, 1.5rem); }
  .turn.past { display: none; }

  /* Pulled up, memory covers the room rather than sharing it. */
  body[data-memory="on"] .thread {
    position: fixed;
    inset: var(--rail) 0 0;
    z-index: 4;
    padding: 1.2rem var(--pad) 5rem;
    background: rgba(5, 9, 13, .97);
    gap: 1.4rem;
  }
  body[data-memory="on"] .fill { display: none; }
  body[data-memory="on"] .turn.past { display: block; }

  /* Shown on a phone, the material is the interface — but not a silent one.
     Her latest line lies along the bottom of it, over a fade so the diagram
     still reads underneath, and taps pass straight through to the thing she
     is showing. Everything older is behind the handle where it was. */
  body[data-stage="on"] .thread {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 32dvh;
    padding: 2.5rem 0 .5rem;
    pointer-events: none;
    background: linear-gradient(to top, var(--void) 42%, rgba(5, 9, 13, .82) 72%, transparent);
    -webkit-mask-image: none;
    mask-image: none;
  }
  body[data-stage="on"] .turn.past,
  body[data-stage="on"] .steps,
  body[data-stage="on"] .took { display: none; }
  body[data-stage="on"] .her { font-size: 1.05rem; line-height: 1.35; }

  /* Pulling memory up wins over both. Declared last and with both attributes
     so it beats the stage rules above it on their own terms. */
  body[data-memory="on"][data-stage="on"] .thread,
  body[data-memory="on"] .thread {
    position: fixed;
    inset: var(--rail) 0 0;
    max-height: none;
    padding: 1.2rem var(--pad) 5rem;
    background: rgba(5, 9, 13, .97);
    pointer-events: auto;
  }
  body[data-memory="on"][data-stage="on"] .turn.past,
  body[data-memory="on"] .turn.past { display: block; }
  body[data-memory="on"][data-stage="on"] .steps,
  body[data-memory="on"][data-stage="on"] .took { display: block; }
  .stage { padding-bottom: .4rem; }
  .stage header { padding-top: .5rem; }
  .stage h2 { font-size: 1rem; }
  .stage .note { display: none; }

  /* Above the memory sheet, always. It covers the room when it is up, and a
     way in that is underneath it is a way in he cannot reach — including the
     handle that closes the sheet again. */
  .dock {
    position: relative;
    z-index: 5;
    background: var(--void);
    gap: .55rem;
    padding-bottom: calc(.6rem + var(--safe-b));
  }
  .pull { display: block; }
  body[data-memory="on"] .pull { color: var(--dim); }
  /* A finger needs more than a cursor does, without becoming a toolbar. */
  .key { width: 2.4rem; height: 2.4rem; }
  .key svg { width: 1.15rem; height: 1.15rem; }
  .dock textarea { font-size: 16px; } /* iOS zooms anything smaller on focus */
}

/* Landscape on a phone: almost no height, so the rail and the words give way
   and whatever she is showing keeps nearly all of it. */
@media (max-height: 460px) and (orientation: landscape) {
  :root { --rail: 2rem; }
  .thread { padding: .5rem 0; gap: .7rem; }
  .her { font-size: 1.05rem; }
  .stage header { padding-top: .35rem; padding-bottom: .4rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body data-state="idle">

<canvas id="field" aria-hidden="true"></canvas>

<div class="room">
  <header class="rail">
    <h1 class="mark">V<em>e</em>la</h1>
    <p class="state" id="state">connecting</p>
    <p class="doing" id="doing"></p>
    <div class="railkeys">
      <button type="button" class="chip" id="chip" hidden></button>
      <span class="probe" id="probe" hidden></span>
    </div>
  </header>

  <div class="floor">
    <div class="thread" id="thread" aria-live="polite">
      <div class="fill"></div>
      <div class="locked" id="locked" hidden></div>
    </div>

    <section class="stage" id="stage" aria-label="What she is showing">
      <header>
        <h2 id="stageTitle"></h2>
        <p class="note" id="stageNote"></p>
        <button type="button" class="shut" id="stageShut" title="Put it away" aria-label="Put it away">×</button>
      </header>
      <iframe id="stageFrame" sandbox="allow-scripts" title="What she is showing"></iframe>
    </section>
  </div>

  <form class="dock" id="dock">
    <button type="button" class="pull" id="pull" aria-label="Show what was said">memory</button>
    <textarea id="text" rows="1" placeholder="" autocomplete="off" spellcheck="false" aria-label="Say something"></textarea>
    <button type="submit" class="key send" id="send">send</button>
    <button type="button" class="key" id="mic" title="Speak. Press again to send." aria-label="Speak" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12Z"/></svg>
    </button>
    <button type="button" class="key" id="ear" title="Hear her replies" aria-label="Hear her replies" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4Zm13.5 3A4.5 4.5 0 0 0 15 8v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
    </button>
  </form>
</div>

<script src="/anime.js"></script>
<script>
"use strict";

/* Her key.

   EventSource cannot carry a header, so it arrives in the address bar, and is
   taken out of the bar immediately so it stops living in the history. That
   alone used to make the page single-use: reloading a tab sent a bare URL and
   she turned it away. The key is kept here instead, so a tab he pinned once
   still opens months later. It stays in this page's own storage, which the
   sandboxed screen frame has no way to read. */
const STORE = "vela.key";
const fromBar = new URLSearchParams(location.search).get("k") || "";
let stored = "";
try { stored = localStorage.getItem(STORE) || ""; } catch { stored = ""; }
if (fromBar) {
  try { localStorage.setItem(STORE, fromBar); } catch { /* private window; this tab still works */ }
  history.replaceState(null, "", location.pathname);
}
const KEY = fromBar || stored;
const auth = { authorization: "Bearer " + KEY };
const json = Object.assign({ "content-type": "application/json" }, auth);

const $ = (id) => document.getElementById(id);
const thread = $("thread"), stateEl = $("state"), doingEl = $("doing"), lockedEl = $("locked");
const dock = $("dock"), text = $("text"), micKey = $("mic"), earKey = $("ear"), sendKey = $("send");
const stage = $("stage"), stageTitle = $("stageTitle"), stageNote = $("stageNote");
const stageFrame = $("stageFrame"), stageShut = $("stageShut"), chip = $("chip"), probe = $("probe");
const pull = $("pull");

const A = window.anime || null;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const animate = (t, o) => (A && !still ? A.animate(t, o) : null);
const phone = () => matchMedia("(max-width: 860px)").matches;

/* Declared up here because her posture depends on them and the first paint
   happens before the stage section below has run. */
let screenUp = null, stageHidden = false;

/* ════════════════════════════════════════════════════════════════════════
   HER PRESENCE

   The whole viewport is the field she is in, so this is painted behind
   everything rather than parked in a corner. Every number it draws with comes
   from something real: the amplitude of whoever is actually making noise, the
   tool calls she actually made, the state she is actually in.

   It holds still when she is idle, and it means it — the loop stops rather
   than repainting a still image sixty times a second. She lives on a second
   monitor all day, and motion that carries nothing is worse than nothing: it
   costs him a core and tells him what he already knew.
   ════════════════════════════════════════════════════════════════════════ */
const canvas = $("field");
const g = canvas.getContext("2d");
let W = 0, H = 0;

const INK = [122, 146, 158];
const CYAN = [79, 209, 219];
const GOLD = [245, 185, 95];
const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
const mix = (a, b, t) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t);

/* Where she is and what she is doing, as numbers the painter can read.
   `cx`, `cy` and `r` are fractions of the viewport, so her posture survives a
   resize; the rest are levels the state machine sets and this eases towards. */
const her = { cx: .68, cy: .5, r: .40, energy: 0, warmth: 0, pale: 0, amp: 0, spin: 0 };
const want = { cx: .68, cy: .5, r: .40, energy: 0, warmth: 0, pale: 0 };
let ripples = [];
let analyser = null, ampData = null;
let painting = false;

function measure() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  posture();
  wake();
}

/**
 * Where she stands, given what the room is doing.
 *
 * One organism changing posture rather than widgets appearing: when she is
 * showing him something she moves in behind the words and gives the material
 * the floor; when nothing is happening she has the room.
 */
function posture() {
  const narrow = phone();
  if (screenUp && !stageHidden) {
    // Showing something. Step aside and get small.
    want.cx = narrow ? .5 : .17;
    want.cy = narrow ? .5 : .8;
    want.r = narrow ? .1 : .13;
  } else if (narrow) {
    want.cx = .5;
    want.cy = .42;
    want.r = .34;
  } else {
    // The room is hers. Tighten a little while she is actually working.
    const busy = document.body.dataset.state === "working";
    want.cx = busy ? .70 : .66;
    want.cy = .5;
    want.r = busy ? .32 : .38;
  }
  wake();
}

const settled = () =>
  Math.abs(her.cx - want.cx) < .001 &&
  Math.abs(her.cy - want.cy) < .001 &&
  Math.abs(her.r - want.r) < .001 &&
  Math.abs(her.energy - want.energy) < .01 &&
  Math.abs(her.warmth - want.warmth) < .01 &&
  Math.abs(her.pale - want.pale) < .01 &&
  her.amp < .01;

/** Anything to say? Otherwise the last frame stands and the loop stops. */
const moving = () => Boolean(analyser) || ripples.length > 0 || !settled() || her.energy > .01;

function wake() {
  if (painting) return;
  painting = true;
  requestAnimationFrame(paint);
}

function paint(now) {
  const ease = still ? 1 : .12;
  her.cx += (want.cx - her.cx) * ease;
  her.cy += (want.cy - her.cy) * ease;
  her.r += (want.r - her.r) * ease;
  her.energy += (want.energy - her.energy) * ease;
  her.warmth += (want.warmth - her.warmth) * ease;
  her.pale += (want.pale - her.pale) * ease;

  let peak = 0;
  if (analyser) {
    analyser.getByteTimeDomainData(ampData);
    for (let i = 0; i < ampData.length; i++) peak = Math.max(peak, Math.abs(ampData[i] - 128));
    peak = Math.min(1, peak / 70);
  }
  her.amp += (peak - her.amp) * .25;
  if (!still) her.spin += .0009 + her.energy * .004;

  g.clearRect(0, 0, W, H);

  const cx = her.cx * W, cy = her.cy * H;
  const R = her.r * Math.min(W, H);
  // Cyan is work, gold is her voice, pale is his. Warmth wins, because when
  // she is speaking that is the only thing worth saying about her.
  const base = mix(mix(INK, CYAN, her.energy), GOLD, her.warmth);
  const tint = mix(base, [225, 240, 246], her.pale * .5);
  const lift = her.amp * .55 + her.energy * .18 + her.warmth * .2;

  // Two quiet rims. These are the shape of her at rest and they barely exist.
  for (let ring = 0; ring < 2; ring++) {
    g.beginPath();
    g.arc(cx, cy, R * (1 + ring * .34), 0, Math.PI * 2);
    g.strokeStyle = rgba(tint, (ring ? .05 : .09) + lift * .1);
    g.lineWidth = 1;
    g.stroke();
  }

  // The voice. The only part that moves quickly, and only when something is
  // actually making noise.
  g.beginPath();
  const STEPS = 168;
  for (let i = 0; i <= STEPS; i++) {
    const a = (i / STEPS) * Math.PI * 2;
    const wob = still ? 0 : Math.sin(a * 3 + her.spin * 4) * 2 + Math.sin(a * 7 - her.spin * 6) * 1.2;
    const voice = her.amp * R * .30 * (.62 + .38 * Math.sin(a * 5 + now / 190));
    const rr = R * .72 + wob * (.4 + her.energy) + voice;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
  g.strokeStyle = rgba(tint, .2 + lift * .55);
  g.lineWidth = 1.2;
  g.stroke();
  if (her.amp > .01 || her.warmth > .01) {
    g.fillStyle = rgba(tint, .015 + her.amp * .05);
    g.fill();
  }

  // Working: one arc, tightening as she goes. Peripheral by design — noticed
  // without being looked at, and absent the moment she stops.
  if (her.energy > .01 && !still) {
    g.beginPath();
    g.arc(cx, cy, R * 1.18, her.spin * 2.1, her.spin * 2.1 + .5 + her.energy * .9);
    g.strokeStyle = rgba(tint, .1 + her.energy * .4);
    g.lineWidth = 1.6;
    g.stroke();
  }

  // One ring per tool call, so the work is countable rather than decorative.
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rip = ripples[i];
    const t = (now - rip.at) / rip.life;
    if (t >= 1) { ripples.splice(i, 1); continue; }
    g.beginPath();
    g.arc(cx, cy, R * (.72 + t * .62), 0, Math.PI * 2);
    g.strokeStyle = rgba(rip.warm ? GOLD : tint, (1 - t) * .3);
    g.lineWidth = 1.2 * (1 - t) + .2;
    g.stroke();
  }

  if (moving()) requestAnimationFrame(paint);
  else painting = false;
}

const ripple = (warm) => {
  if (still) return;
  ripples.push({ at: performance.now(), life: warm ? 2200 : 1300, warm: !!warm });
  wake();
};

addEventListener("resize", measure);
measure();

/* ════════════════════════════════════════════════════════════════════════
   State

   Five words, and each of them is true of something the core actually said.
   ════════════════════════════════════════════════════════════════════════ */
function setState(state, word) {
  document.body.dataset.state = state;
  stateEl.textContent = word;
  want.energy = state === "working" ? 1 : 0;
  want.warmth = state === "speaking" ? 1 : 0;
  want.pale = state === "listening" ? 1 : 0;
  posture();
}

function doing(line) {
  // Cleared out, not just faded: a line left in the DOM at zero opacity is
  // still a line a screen reader reads out as though she were still on it.
  doingEl.textContent = line || "";
  doingEl.classList.toggle("on", Boolean(line));
}

/* ════════════════════════════════════════════════════════════════════════
   What was said
   ════════════════════════════════════════════════════════════════════════ */
let open = null, pinned = true;
thread.addEventListener("scroll", () => {
  pinned = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
});
const follow = () => { if (pinned) thread.scrollTop = thread.scrollHeight; };
const enter = (el, from) => animate(el, { opacity: [0, 1], translateY: [from === undefined ? 8 : from, 0], duration: 400, ease: "outCubic" });

/** Exactly one exchange is ever at full weight. */
function recede() {
  for (const el of thread.querySelectorAll(".turn:not(.past)")) el.classList.add("past");
}

function turnEl(cls) {
  const el = document.createElement("article");
  el.className = "turn" + (cls ? " " + cls : "");
  thread.append(el);
  return el;
}

function yours(said, onscreen) {
  recede();
  const el = turnEl();
  const p = document.createElement("p");
  p.className = "you" + (onscreen ? " onscreen" : "");
  p.textContent = said;
  el.append(p);
  enter(el);
  follow();
  return el;
}

/** Her half of the exchange he is in the middle of. */
function hers() {
  if (open) return open;
  const last = thread.querySelector(".turn:last-child");
  // Attach to the line he just said, unless she is starting this herself.
  const el = last && !last.classList.contains("past") && !last.querySelector(".her")
    ? last
    : (recede(), turnEl());

  const said = document.createElement("p");
  said.className = "her";
  const caret = document.createElement("span");
  caret.className = "caret";
  said.append(caret);
  el.append(said);
  enter(said, 6);
  animate(caret, { opacity: [1, .15], duration: 620, loop: true, alternate: true, ease: "inOutSine" });

  // `raw` is what she actually sent; `words` is that with the markdown taken
  // out, which is what is drawn and what the reading head measures against.
  open = { el, said, caret, startedAt: Date.now(), firstDelta: 0, raw: "", words: "", spoken: 0, emitted: 0, spans: [], steps: [] };
  setState("working", "working");
  follow();
  return open;
}

/* ── what she did, in words ───────────────────────────────────────────────
   A tool line is a verb and an object: "Read core.ts", "Bash npm test",
   "gws-calendar +agenda". Counted by verb they become a sentence, which is
   what he actually wants to know after the fact — "read two files and ran a
   command" rather than a column of tool names. The counts are real, because
   a summary that rounds off what she touched is worse than no summary. */
function stepKind(line) {
  const v = line.trim().split(/[\s(]/)[0].toLowerCase();
  if (/^(read|cat|head|tail|open|notebookread)$/.test(v)) return "read";
  if (/^(write|edit|multiedit|notebookedit)$/.test(v)) return "changed";
  if (/^(grep|glob|find|search)$/.test(v)) return "searched";
  if (/^(bash|powershell|shell|npm|git|run)$/.test(v)) return "ran";
  if (/^(webfetch|websearch|curl)$/.test(v) || v.includes("reach")) return "web";
  if (/^(remember|recall|forget)$/.test(v)) return "memory";
  if (/^(launch_app|media_control|list_windows|browser_history)$/.test(v)) return "desktop";
  if (/^(watch|list_watches|resolve_watch)$/.test(v)) return "watch";
  if (/^(show_screen|clear_screen)$/.test(v)) return "screen";
  if (v.startsWith("gws-calendar")) return "calendar";
  if (v.startsWith("gws-gmail")) return "mail";
  if (v.startsWith("gws-")) return "google";
  return "other";
}

const NUMBER = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
const count = (n) => (n < NUMBER.length ? NUMBER[n] : String(n));

function phraseFor(kind, n) {
  const many = n > 1;
  switch (kind) {
    case "read": return "read " + count(n) + (many ? " files" : " file");
    case "changed": return "changed " + count(n) + (many ? " files" : " file");
    case "searched": return many ? "searched " + count(n) + " times" : "searched";
    case "ran": return "ran " + count(n) + (many ? " commands" : " command");
    case "web": return many ? "looked " + count(n) + " things up" : "looked something up";
    case "memory": return many ? "went through her memory" : "checked her memory";
    case "desktop": return "used the desktop";
    case "watch": return many ? "sorted the watches" : "set a watch";
    case "screen": return "put something on screen";
    case "calendar": return "checked your calendar";
    case "mail": return "checked your mail";
    case "google": return "used your Google account";
    default: return count(n) + (many ? " other things" : " other thing");
  }
}

function inWords(lines) {
  const tally = new Map();
  for (const line of lines) {
    const kind = stepKind(line);
    tally.set(kind, (tally.get(kind) || 0) + 1);
  }
  const groups = [...tally].sort((a, b) => b[1] - a[1]);
  const said = groups.slice(0, 3).map(([kind, n]) => phraseFor(kind, n));
  const rest = groups.slice(3).reduce((sum, [, n]) => sum + n, 0);
  if (rest) said.push(count(rest) + " more");
  if (said.length === 1) return said[0];
  return said.slice(0, -1).join(", ") + " and " + said[said.length - 1];
}

/* How many of them are worth building. Thirty nodes under every exchange, in
   a page he leaves open for days, is a cost nobody reads the bottom of. The
   rest are one click away and are not built until he asks. */
const RECENT_STEPS = 7;

function tool(lines) {
  const t = hers();
  for (const line of lines) {
    t.steps.push(line);
    ripple(false);
  }
  doing(lines[lines.length - 1]);
  follow();
}

/* ── markdown ─────────────────────────────────────────────────────────────
   She writes plain sentences in conversation and markdown when she is doing
   real work, and both arrive here. Set in the display serif, `**like this**`
   reads as broken rather than as emphasis, and handed to Kokoro it is read
   out loud as asterisks.

   Two cleanings, because the eye and the ear want different things: the eye
   wants the code kept and the markers gone, the ear wants to be told there
   was code and to move on. Mirrors speakable() in voice.ts. */

/**
 * How much of a streaming reply is safe to strip.
 *
 * A pair of markers is only a pair once the second half has arrived, so
 * `**bol` is not emphasis yet and stripping it would take away a marker that
 * turns out to be literal. Everything from the last unclosed marker onward
 * waits for the rest.
 */
function settledUpto(raw) {
  let i = 0, open = null, opened = 0;
  while (i < raw.length) {
    const two = raw.slice(i, i + 2);
    if (!open && two === "**") { open = "**"; opened = i; i += 2; continue; }
    if (open === "**" && two === "**") { open = null; i += 2; continue; }
    if (!open && raw[i] === "`") { open = "`"; opened = i; i += 1; continue; }
    if (open === "`" && raw[i] === "`") { open = null; i += 1; continue; }
    i++;
  }
  return open ? opened : raw.length;
}

/** For the eye: the markers go, everything they were wrapped around stays. */
function forReading(text) {
  return text
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
}

/** For the ear: the same, plus the things that only make sense on a page. */
function forSaying(text) {
  return text
    .replace(/```[\s\S]*?```/g, " code block. ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " a link ")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/^\s*[-*]\s+/gm, "")
    .replace(/[A-Za-z]:[\\/][\w.\-\\/ ]+[\\/]([\w.\-]+)/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

/**
 * Set the words that have landed, one span each.
 *
 * The last token is held back until whitespace follows it, because a word
 * half-arrived is a word spelling itself out, and that reads as a stutter
 * rather than as speech. Each span remembers where it sits in the reply, which
 * is what lets the audio light it later.
 */
function renderWords(t, final) {
  const tokens = t.words.split(/(\s+)/);
  const upto = final ? tokens.length : tokens.length - 1;
  let at = 0;
  for (let i = 0; i < upto; i++) {
    const tok = tokens[i];
    const start = at;
    at += tok.length;
    if (i < t.emitted || !tok) continue;
    if (/^\s+$/.test(tok)) {
      t.said.insertBefore(document.createTextNode(tok), t.caret);
      continue;
    }
    const span = document.createElement("span");
    span.className = "w";
    span.textContent = tok;
    t.said.insertBefore(span, t.caret);
    t.spans.push({ el: span, start, end: at });
    animate(span, { opacity: [0, 1], filter: ["blur(4px)", "blur(0px)"], duration: 280, ease: "outQuad" });
  }
  t.emitted = Math.max(t.emitted, upto);
}

function delta(chunk) {
  const t = hers();
  if (!t.firstDelta) t.firstDelta = Date.now();
  t.raw += chunk;
  // Only the part with no half-written marker in it. The rest is one chunk
  // away and drawing it now would show a `**` that is about to disappear.
  t.words = forReading(t.raw.slice(0, settledUpto(t.raw)));
  renderWords(t);
  speakReady(t);
  follow();
}

function done(ms, fallback) {
  const t = open;
  if (!t) return;
  if (fallback && !t.raw) t.raw = fallback;
  // Nothing more is coming, so the marker that never closed was literal.
  t.words = forReading(t.raw);
  renderWords(t, true);
  t.caret.remove();
  speakRest(t);
  doing("");

  const total = ms || Date.now() - t.startedAt;
  if (t.steps.length) {
    const list = document.createElement("ul");
    list.className = "stepped";
    list.hidden = true;

    const shown = t.steps.slice(-RECENT_STEPS);
    const earlier = t.steps.slice(0, t.steps.length - shown.length);
    const put = (line, before) => {
      const li = document.createElement("li");
      li.textContent = line;
      list.insertBefore(li, before || null);
      return li;
    };
    for (const line of shown) put(line);

    // Older than the last few: named, counted, and built only if he asks.
    if (earlier.length) {
      const more = document.createElement("li");
      const link = document.createElement("button");
      link.type = "button";
      link.className = "steps";
      link.textContent = count(earlier.length) + " more before that";
      link.addEventListener("click", () => {
        for (const line of earlier) put(line, more);
        more.remove();
        follow();
      });
      more.append(link);
      list.insertBefore(more, list.firstChild);
    }

    const button = document.createElement("button");
    button.type = "button";
    button.className = "steps";
    button.textContent = inWords(t.steps) + " · " + (total / 1000).toFixed(1) + "s";
    button.addEventListener("click", () => {
      list.hidden = !list.hidden;
      follow();
    });
    t.el.append(button, list);
  } else {
    const took = document.createElement("p");
    took.className = "took";
    took.textContent = (total / 1000).toFixed(1) + "s";
    t.el.append(took);
  }

  open = null;
  if (!speakingNow) setState("idle", "with you");
  follow();
}

/** She started this one. It should reach him without behaving like a website. */
function unbidden(said) {
  recede();
  const el = turnEl("unbidden");
  const when = document.createElement("span");
  when.className = "when";
  const now = new Date();
  when.textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const p = document.createElement("p");
  p.className = "her";
  p.textContent = said;
  el.append(when, p);
  animate(el, { opacity: [0, 1], translateX: [-10, 0], duration: 520, ease: "outCubic" });
  ripple(true);
  if (speaking) enqueue(said);
  if (phone() && document.body.dataset.memory === "on") memory(false);
  follow();
}

function hitch(message) {
  const el = turnEl();
  const p = document.createElement("p");
  p.className = "hitch";
  p.textContent = message;
  el.append(p);
  enter(el);
  follow();
}

/* ════════════════════════════════════════════════════════════════════════
   The stage

   She writes a page and shows it; it lands here. The iframe's URL carries a
   screen-scoped key, minted per show, that opens /screen/file and nothing
   else — the master token never enters a page she wrote. Anything inside can
   call parent.postMessage({ vela: "..." }, "*") and it reaches her as words.
   ════════════════════════════════════════════════════════════════════════ */
function showScreen(meta, quiet) {
  screenUp = meta || null;
  if (!screenUp) {
    stageFrame.removeAttribute("src");
    document.body.removeAttribute("data-stage");
    chip.hidden = true;
    stageHidden = false;
    posture();
    return;
  }
  stageTitle.textContent = screenUp.title;
  stageNote.textContent = screenUp.note || "";
  chip.textContent = screenUp.title;
  stageFrame.src = "/screen/file?s=" + encodeURIComponent(screenUp.s || "");
  stageHidden = false;
  chip.hidden = true;
  document.body.dataset.stage = "on";
  if (phone()) memory(false);
  posture();
  animate(stage, { opacity: [0, 1], duration: 460, ease: "outCubic" });
  if (!quiet) follow();
}

/* His gesture only. What she is showing stays shown, one word away. */
function stageAway() {
  stageHidden = true;
  document.body.removeAttribute("data-stage");
  chip.hidden = !screenUp;
  posture();
}

stageShut.addEventListener("click", stageAway);
chip.addEventListener("click", () => { if (screenUp) showScreen(screenUp, true); });

/* What he does on her page comes back as words. Only from the stage's own
   window, only a string, and never more than a sentence's worth. */
addEventListener("message", (e) => {
  if (!screenUp || !stageFrame.contentWindow || e.source !== stageFrame.contentWindow) return;
  const said = e.data && typeof e.data.vela === "string" ? e.data.vela.trim().slice(0, 500) : "";
  if (!said) return;
  yours(said, true);
  deliver("[He did this on the screen: " + said + "]");
});

/* ════════════════════════════════════════════════════════════════════════
   Her voice: the same Kokoro the terminal uses
   ════════════════════════════════════════════════════════════════════════ */
let speaking = false, canSpeak = false, speakingNow = false;
let audioQueue = [], playing = false, current = null, sound = null;

/**
 * A browser starts an AudioContext suspended unless it was made during a real
 * click, and routing an element through a suspended one is silence with no
 * error to show for it. Built on the button press; every caller checks it is
 * genuinely running before attaching anything.
 */
function ears() {
  if (!sound) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { sound = new Ctx(); } catch { return null; }
  }
  if (sound.state === "suspended") sound.resume().catch(() => {});
  return sound;
}
function liveEars() {
  const ctx = ears();
  return ctx && ctx.state === "running" ? ctx : null;
}

/* The same graded pause the terminal uses, so both faces breathe alike. A
   clause is barely a beat, a question hangs, a paragraph is a proper stop.
   Mirrors gapFor() in voice.ts. */
function gapAfter(said, base) {
  const end = said.trimEnd().slice(-1);
  const scale = /\n/.test(said.slice(-2)) ? 2.6
    : end === "?" || end === "!" ? 1.6
    : end === "." ? 1.15
    : end === "," || end === ";" || end === ":" ? 0.7
    : 0.75;
  let n = 0;
  for (let i = 0; i < said.length; i++) n = (n * 31 + said.charCodeAt(i)) >>> 0;
  return Math.round((base || 150) * scale * (0.85 + (n % 30) / 100));
}

/* Break a long sentence at its clauses, so each one gets its own beat. Handed
   over whole, a three-clause sentence is synthesised as one unbroken run and
   the pauses above never fire inside it. Mirrors clauses() in voice.ts, but
   carries character offsets because the reading head sweeps by range. */
const CLAUSE_MIN_WORDS = 3, CLAUSE_MIN_CHARS = 70;
function countWords(s) { return s.trim().split(/\s+/).filter(Boolean).length; }
function clausesOf(body, from) {
  if (body.trim().length < CLAUSE_MIN_CHARS || body.includes("```")) {
    return [[body, from, from + body.length]];
  }
  const out = [];
  let at = 0;
  for (;;) {
    const cut = /[,;:]\s/.exec(body.slice(at));
    if (!cut) break;
    const end = at + cut.index + 1;
    const head = body.slice(at, end), tail = body.slice(end + cut[0].length - 1);
    if (countWords(head) < CLAUSE_MIN_WORDS || countWords(tail) < CLAUSE_MIN_WORDS) break;
    out.push([head, from + at, from + end]);
    at = end + cut[0].length - 1;
  }
  if (at < body.length) out.push([body.slice(at), from + at, from + body.length]);
  return out.length ? out : [[body, from, from + body.length]];
}

async function enqueue(sentence, range) {
  // What reaches Kokoro is the spoken form, so she never reads a backtick or
  // a URL out loud. The range stays in the coordinates of what is on screen,
  // which is what the reading head sweeps across.
  const said = forSaying(sentence).trim();
  if (!said || !canSpeak || !speaking) return;
  audioQueue.push({ said, range: range || null, spans: (open && open.spans) || null });
  if (!playing) drainAudio();
}

/**
 * The reading head.
 *
 * Kokoro returns a wav and no word timings, so the sweep is proportional:
 * the audio's own duration spread across the characters of the sentence it
 * came from. It is an approximation, and at one sentence at a time it is close
 * enough to track by eye. It follows the real clock of the real audio, so it
 * stops dead when she is cut off rather than finishing without her.
 */
function sweep(el, item) {
  if (!item.spans || !item.range) return () => {};
  const [from, to] = item.range;
  const width = to - from;
  const mine = item.spans.filter((s) => s.start >= from && s.end <= to);
  if (!mine.length || !width) return () => {};

  let alive = true;
  (function tick() {
    if (!alive) return;
    requestAnimationFrame(tick);
    const d = el.duration;
    if (!d || !isFinite(d)) return;
    const head = from + (el.currentTime / d) * width;
    for (const s of mine) {
      const on = s.start <= head && head < s.end;
      const gone = s.end <= head;
      s.el.classList.toggle("saying", on);
      s.el.classList.toggle("said", gone);
    }
  })();

  return () => {
    alive = false;
    for (const s of mine) s.el.classList.remove("saying");
  };
}

async function drainAudio() {
  playing = true;
  let first = true;
  while (audioQueue.length && speaking) {
    const item = audioQueue.shift();
    const said = item.said;
    // Never before the opening sentence, which is the one he is waiting on.
    if (!first) await new Promise((r) => setTimeout(r, gapAfter(said, 150)));
    first = false;
    try {
      const res = await fetch("/speak", { method: "POST", headers: json, body: JSON.stringify({ text: said }) });
      if (!res.ok) continue;
      const url = URL.createObjectURL(await res.blob());
      await new Promise((finish) => {
        const a = new Audio(url);
        current = a;
        // A field that does not move is a small loss. A voice that does not
        // play is the whole feature, so the tap is optional and playback is not.
        const ctx = liveEars();
        if (ctx) {
          try {
            const src = ctx.createMediaElementSource(a);
            const an = ctx.createAnalyser();
            an.fftSize = 512;
            src.connect(an);
            an.connect(ctx.destination);
            analyser = an;
            ampData = new Uint8Array(an.frequencyBinCount);
            wake();
          } catch { analyser = null; }
        }
        speakingNow = true;
        setState("speaking", "speaking");
        const stopSweep = sweep(a, item);
        const end = () => { stopSweep(); URL.revokeObjectURL(url); current = null; finish(); };
        a.onended = a.onerror = end;
        a.play().catch(end);
      });
    } catch { /* a sentence that would not render is skipped, not fatal */ }
  }
  playing = false;
  speakingNow = false;
  analyser = null;
  if (!open) setState("idle", "with you");
}

/** Stop mid-sentence. Called when he talks over her. */
function hush() {
  audioQueue = [];
  if (current) { try { current.pause(); } catch {} current.onended = current.onerror = null; current = null; }
  // The head must not be left lit on the word she was cut off at.
  for (const el of document.querySelectorAll(".w.saying")) el.classList.remove("saying");
  playing = false;
  speakingNow = false;
  analyser = null;
}

const ENDS = /[.!?]["')\]]?(\s|$)/g;
function speakReady(t) {
  if (!speaking) return;
  ENDS.lastIndex = 0;
  let cut = -1, m;
  while ((m = ENDS.exec(t.words))) cut = m.index + m[0].length;
  if (cut > t.spoken) {
    for (const [piece, from, to] of clausesOf(t.words.slice(t.spoken, cut), t.spoken)) {
      enqueue(piece, [from, to]);
    }
    t.spoken = cut;
  }
}
function speakRest(t) {
  if (speaking && t.words.length > t.spoken) {
    for (const [piece, from, to] of clausesOf(t.words.slice(t.spoken), t.spoken)) {
      enqueue(piece, [from, to]);
    }
    t.spoken = t.words.length;
  }
}

/* "She is about to need this." Her speech models are held back until first
   use, so an idle Vela is ~430MB rather than 1.5GB. Saying so at the gesture
   rather than at the sentence is what keeps that free: the load happens while
   he is still talking, or still reading. */
function warm(what) {
  fetch("/warm", { method: "POST", headers: json, body: JSON.stringify({ what: what }) }).catch(() => {});
}

earKey.addEventListener("click", () => {
  speaking = !speaking;
  earKey.setAttribute("aria-pressed", String(speaking));
  // Inside the click, because this is the gesture the browser wants before it
  // will let the page make noise.
  if (speaking) { ears(); warm("voice"); }
  else hush();
});

/* ════════════════════════════════════════════════════════════════════════
   His voice
   ════════════════════════════════════════════════════════════════════════ */
let recorder = null, chunks = [], canHear = false, cutOff = false, micStream = null;

async function startListening() {
  /* Talking over her is an answer in itself: she has said enough. Stop her
     mid-word, and remember it so the next turn carries the reason. */
  if (speakingNow || audioQueue.length) { hush(); cutOff = true; }

  // Whisper loads while he is still talking, which is the whole gap it needs.
  warm("ears");

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(micStream);
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onHeard;
    recorder.start();

    // Nothing is routed through the context here, so a suspended one costs the
    // drawing and never the recording.
    const ctx = liveEars();
    if (ctx) {
      try {
        const an = ctx.createAnalyser();
        an.fftSize = 512;
        ctx.createMediaStreamSource(micStream).connect(an);
        analyser = an;
        ampData = new Uint8Array(an.frequencyBinCount);
        wake();
      } catch { analyser = null; }
    }

    micKey.classList.add("hot");
    setState("listening", "listening");
  } catch {
    hitch("The browser would not open the microphone. Check its permission for this page.");
  }
}

async function onHeard() {
  micStream && micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
  analyser = null;
  micKey.classList.remove("hot");
  setState("working", "hearing");
  try {
    const res = await fetch("/hear", { method: "POST", headers: auth, body: new Blob(chunks) });
    const { text: heard } = await res.json();
    if (heard && heard.trim()) say(heard.trim());
    else { setState("idle", "with you"); hitch("Nothing came through on that one."); }
  } catch {
    setState("idle", "with you");
    hitch("Could not send that recording.");
  }
}

micKey.addEventListener("click", () => {
  if (recorder && recorder.state === "recording") recorder.stop();
  else startListening();
});

/* ════════════════════════════════════════════════════════════════════════
   The wire
   ════════════════════════════════════════════════════════════════════════ */
/**
 * A turn that will never finish, closed out honestly.
 *
 * The stream is the only way a turn ends, so if it drops while she is
 * answering, the result lands in a socket nobody is holding and the page waits
 * for ever: caret blinking, tool line stuck in the rail, no reply coming. Left
 * alone it looks exactly like her thinking, which is the worst thing it could
 * look like. Whatever words did arrive are kept — they were really said.
 */
function abandon(why) {
  const t = open;
  if (!t) return;
  renderWords(t, true);
  t.caret.remove();
  doing("");
  const note = document.createElement("p");
  note.className = "took";
  note.textContent = why;
  t.el.append(note);
  open = null;
  setState("idle", "with you");
  follow();
}

function listen() {
  const events = new EventSource("/events?k=" + encodeURIComponent(KEY));
  let dropped = false;
  events.onopen = () => {
    // Back after a drop. Anything she was saying went with it, and a service
    // that restarted is a different session from the one this page was
    // talking to, so the turn is not coming back either way.
    if (dropped) abandon(open ? "lost her mid-answer, the connection dropped" : "");
    dropped = false;
    if (!open && !speakingNow) setState("idle", "with you");
  };
  events.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === "activity") tool(ev.lines || []);
    else if (ev.type === "delta") delta(ev.text || "");
    else if (ev.type === "result") done(ev.ms, ev.text);
    else if (ev.type === "say") unbidden(ev.text || "");
    else if (ev.type === "show") showScreen(ev.screen);
    else if (ev.type === "error") { hitch(ev.message || "Something went wrong."); open = null; doing(""); setState("idle", "with you"); }
  };
  // It reconnects itself. Say so, because silence is also what working looks like.
  events.onerror = () => {
    dropped = true;
    setState("lost", "reaching");
  };
}

/* Hand her a turn. The line on screen is the caller's business, because a
   typed line and a click on the stage read differently. */
async function deliver(said, interrupted) {
  try {
    const res = await fetch("/turn", {
      method: "POST",
      headers: json,
      body: JSON.stringify({ text: said, cutOff: Boolean(interrupted) }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      hitch("She did not take that: " + (body.error || res.status));
    }
  } catch {
    hitch("Could not reach her. The service may have stopped.");
    setState("lost", "offline");
  }
}

async function say(said) {
  yours(said);
  const interrupted = cutOff;
  cutOff = false;
  return deliver(said, interrupted);
}

/* ════════════════════════════════════════════════════════════════════════
   The way in

   Dormant until he means to type. Typing anywhere wakes it, so the keyboard
   is the shortcut and there is nothing to learn; it collapses again once he
   is done, rather than holding the bottom of the room open all day.
   ════════════════════════════════════════════════════════════════════════ */
const typing = () => {
  const on = document.activeElement === text || text.value.length > 0;
  if (on) document.body.dataset.typing = "on";
  else document.body.removeAttribute("data-typing");
};
const grow = () => {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, innerHeight * 0.24) + "px";
};

text.addEventListener("input", () => { grow(); typing(); });
text.addEventListener("focus", typing);
text.addEventListener("blur", typing);
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); dock.requestSubmit(); }
  if (e.key === "Escape") text.blur();
});

dock.addEventListener("submit", (e) => {
  e.preventDefault();
  const said = text.value.trim();
  if (!said) return;
  if (speakingNow || audioQueue.length) { hush(); cutOff = true; } // typing over her counts too
  text.value = "";
  grow();
  typing();
  say(said);
});

addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // A printable key means he has started talking to her. "/" is the same
  // intent said deliberately, and never lands in the box itself.
  if (e.key === "/") { e.preventDefault(); text.focus(); return; }
  if (e.key.length === 1) text.focus();
});

/* Memory, on a phone, is pulled up rather than left open. */
function memory(on) {
  if (on === undefined) on = document.body.dataset.memory !== "on";
  if (on) document.body.dataset.memory = "on";
  else document.body.removeAttribute("data-memory");
  pull.textContent = on ? "close" : "memory";
  if (on) follow();
}
pull.addEventListener("click", () => memory());

/* The developer half, one keystroke away and absent otherwise. She does not
   print her own pid at him all day to prove she is running. */
let probing = false;
addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  if (e.key !== "`") return;
  probing = !probing;
  probe.hidden = !probing;
});

/* On a phone the software keyboard steals half the room. Track the real
   visible viewport so the dock stays where his thumb left it. */
if (window.visualViewport) {
  const fit = () => {
    const gap = Math.max(0, innerHeight - visualViewport.height - visualViewport.offsetTop);
    document.documentElement.style.setProperty("--safe-b", gap ? gap + "px" : "env(safe-area-inset-bottom, 0px)");
  };
  visualViewport.addEventListener("resize", fit);
  visualViewport.addEventListener("scroll", fit);
}

/* ════════════════════════════════════════════════════════════════════════
   Coming up
   ════════════════════════════════════════════════════════════════════════ */

/* No key, or one she no longer accepts. Say which, and say where the real one
   lives — a page that just sits there dead is the worst of the three. */
function locked(why) {
  try { localStorage.removeItem(STORE); } catch { /* nothing to forget */ }
  setState("lost", "locked");
  lockedEl.hidden = false;
  lockedEl.innerHTML =
    "<b>She does not know this tab.</b>" + why +
    " Her link, with the key on the end of it, is printed by <code>npm run serve</code>" +
    " and kept in <code>data/server.json</code>. Open it once and this tab remembers.";
  dock.hidden = true;
}

if (!KEY) {
  locked("");
} else {
  fetch("/health", { headers: auth })
    .then((r) => {
      if (r.status === 401) { locked(" The key it had is not hers any more."); return null; }
      return r.json();
    })
    .then((h) => {
      if (!h) return;
      probe.textContent = h.name.toLowerCase() + " · pid " + h.pid;
      canHear = Boolean(h.canHear);
      canSpeak = Boolean(h.canSpeak);
      // A control that cannot work is worse than no control.
      micKey.hidden = !canHear;
      earKey.hidden = !canSpeak;
    })
    .catch(() => {});

  /* Whatever she had up survives a reload. Quiet, because the stage opening
     again is not news. */
  fetch("/screen", { headers: auth })
    .then((r) => (r.ok ? r.json() : { screen: null }))
    .then(({ screen }) => { if (screen) showScreen(screen, true); })
    .catch(() => {});

  listen();
}

// She is here before the page is, so it settles in rather than performing an
// arrival. One sequence, once.
if (A && !still) {
  A.animate(canvas, { opacity: [0, 1], duration: 900, ease: "outCubic" });
  A.animate(".rail > *", { opacity: [0, 1], duration: 500, delay: A.stagger(70), ease: "outCubic" });
  A.animate(".dock", { opacity: [0, 1], duration: 500, delay: 260, ease: "outCubic" });
}
</script>
</body>
